function openIDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(IDB_NAME,IDB_VERSION);req.onerror=()=>reject(req.error);req.onsuccess=()=>resolve(req.result);req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(STORE_NAME))db.createObjectStore(STORE_NAME);};});}
function idbGet(){return new Promise((resolve,reject)=>{const tx=idb.transaction(STORE_NAME,'readonly');const req=tx.objectStore(STORE_NAME).get(DATA_KEY);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
function idbSet(data){return new Promise((resolve,reject)=>{const tx=idb.transaction(STORE_NAME,'readwrite');const req=tx.objectStore(STORE_NAME).put(data,DATA_KEY);req.onsuccess=()=>resolve();req.onerror=()=>reject(req.error);});}
async function loadData(){
try{let data=await idbGet();
if(!data){try{const legacy=localStorage.getItem('accountingPro_data_v2');if(legacy){data=JSON.parse(legacy);await idbSet(data);localStorage.removeItem('accountingPro_data_v2');}}catch(_){}}
if(data){DB=data;for(const k of Object.keys(defaultData)){if(DB[k]===undefined)DB[k]=JSON.parse(JSON.stringify(defaultData[k]));}
if(!DB.settings)DB.settings={...defaultData.settings};for(const sk of Object.keys(defaultData.settings)){if(DB.settings[sk]===undefined)DB.settings[sk]=defaultData.settings[sk];}
// Full reset of operational data + restore standard Chart of Accounts (one-time)
if(!DB.settings.fullResetCoaLinkV1){
  const emptyMods=['clients','suppliers','invoices','quotations','workOrders','receipts','expenses','commissions','creditPayments','refunds','discounts','loans','chequePayments','dividends','taxPayments','serviceTransactions','journalEntries','commissionSuppliers'];
  emptyMods.forEach(m=>{DB[m]=[];});
  DB.wallets=[];
  DB.nextJournalNo=1;
  DB.chartOfAccounts=JSON.parse(JSON.stringify(defaultData.chartOfAccounts));
  // Keep serviceItems master catalog; reset numbering if present
  if(DB.settings){
    DB.settings.nextInvoiceNo=DB.settings.nextInvoiceNo||1;
    DB.settings.nextQuotationNo=DB.settings.nextQuotationNo||1;
    DB.settings.nextWorkOrderNo=DB.settings.nextWorkOrderNo||1;
  }
  DB.settings.fullResetCoaLinkV1=true;
  DB.settings.clearedAllCoaV1=true;
}
delete DB.servicePackages;
if(!Array.isArray(DB.commissionSuppliers))DB.commissionSuppliers=[];
if(!Array.isArray(DB.activityLog))DB.activityLog=[];
if(!Array.isArray(DB.users)||!DB.users.length){
  DB.users=[{id:'admin',name:'Administrator',role:'admin',email:'admin@company.com',password:'Tamkeen@2026',permissions:['*'],active:true}];
}else{
  // ensure admin exists with default password if missing password
  let admin=DB.users.find(u=>u.role==='admin'||u.id==='admin');
  if(!admin){
    DB.users.unshift({id:'admin',name:'Administrator',role:'admin',email:'admin@company.com',password:'Tamkeen@2026',permissions:['*'],active:true});
  }else{
    if(!admin.password)admin.password='Tamkeen@2026';
    if(!admin.permissions||!admin.permissions.length)admin.permissions=['*'];
    admin.role='admin';admin.active=true;
  }
  DB.users.forEach(u=>{
    if(!Array.isArray(u.permissions))u.permissions=u.role==='admin'?['*']:[];
    if(u.active===undefined)u.active=true;
    if(!u.password)u.password='';
  });
}

if(!Array.isArray(DB.serviceGroups))DB.serviceGroups=[];
// Always sync service master list from the latest catalog (Excel import) when count differs
if(!DB.serviceItems||!DB.serviceItems.length||DB.serviceItems.length!==defaultData.serviceItems.length||!DB.serviceItems[0]?.code){
  DB.serviceItems=JSON.parse(JSON.stringify(defaultData.serviceItems));
}
// Migrate legacy employeeName → employees[] on establishments
(DB.clients||[]).forEach(c=>{
  if(!Array.isArray(c.employees))c.employees=[];
  if(c.employeeName && !c.employees.some(e=>e.name===c.employeeName)){
    c.employees.push({id:'id_emp_'+Math.random().toString(36).slice(2,9),name:c.employeeName});
  }
});
}else{DB=JSON.parse(JSON.stringify(defaultData));await saveDataNow();}}
catch(e){console.error(e);DB=JSON.parse(JSON.stringify(defaultData));}}

function numberToWords(n){
  n=Math.round((Number(n)||0)*100)/100;
  const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function under1000(x){
    x=Math.floor(x);
    if(x<20)return ones[x];
    if(x<100)return tens[Math.floor(x/10)]+(x%10?' '+ones[x%10]:'');
    return ones[Math.floor(x/100)]+' Hundred'+(x%100?' '+under1000(x%100):'');
  }
  function underMillion(x){
    x=Math.floor(x);
    if(x<1000)return under1000(x);
    if(x<1000000)return under1000(Math.floor(x/1000))+' Thousand'+(x%1000?' '+under1000(x%1000):'');
    return under1000(Math.floor(x/1000000))+' Million'+(x%1000000?' '+underMillion(x%1000000):'');
  }
  const neg=n<0;n=Math.abs(n);
  const whole=Math.floor(n);
  const fils=Math.round((n-whole)*100);
  let words=(whole===0?'Zero':underMillion(whole))+' Dirhams';
  if(fils>0)words+=' and '+under1000(fils)+' Fils';
  words+=' Only';
  return (neg?'Minus ':'')+words;
}

function filterSvcCombo(input){
  const wrap=input.closest('.svc-combo');
  if(!wrap)return;
  const list=wrap.querySelector('.svc-list');
  if(!list)return;
  const q=(input.value||'').toLowerCase().trim();
  const items=DB.serviceItems||[];
  const matched=items.filter(i=>{
    if(!q)return true;
    const name=(i.name||'').toLowerCase();
    const code=(i.code||'').toLowerCase();
    const dept=(i.department||'').toLowerCase();
    return name.includes(q)||code.includes(q)||dept.includes(q);
  });
  const show=matched.slice(0,80);
  if(!show.length){
    list.innerHTML=`<div class="svc-opt muted">No service match</div>`;
  }else{
    list.innerHTML=show.map(i=>{
      const label=i.code?`${esc(i.name)} (${esc(i.code)})`:`${esc(i.name)}`;
      return `<div class="svc-opt" data-val="${esc(i.name)}" onmousedown="event.preventDefault();pickSvcCombo(this)">${label}</div>`;
    }).join('')+(matched.length>80?`<div class="svc-opt muted">… ${matched.length-80} more — keep typing</div>`:'');
  }
  wrap.classList.add('open');
}

  const name=optEl.getAttribute('data-val')||optEl.textContent||'';

function applyServiceRatesToRow(tr, serviceName){
  if(!tr||tr.dataset.locked==='1')return;
  const svc=findServiceItem(serviceName);
  if(!svc)return;
  // Master Excel: Fees → Fees/Rate, Cost → Cost, Service Charge → SC
  const fee=Number(svc.rate)||0;
  const cost=Number(svc.cost)||0;
  const sc=Number(svc.sc)||0;
  const feeEl=tr.querySelector('.item-fee');
  const costEl=tr.querySelector('.item-cost');
  const scEl=tr.querySelector('.item-sc');
  const commEl=tr.querySelector('.item-comm');
  const commSupEl=tr.querySelector('.item-commsup');
  if(feeEl&&!feeEl.disabled){feeEl.value=fmt2(fee);feeEl.dispatchEvent(new Event('input',{bubbles:true}));}
  if(costEl&&!costEl.disabled){costEl.value=fmt2(cost);}
  if(scEl&&!scEl.disabled){scEl.value=fmt2(sc);scEl.dispatchEvent(new Event('input',{bubbles:true}));}
  if(commEl&&!commEl.disabled&&svc.commission!=null)commEl.value=fmt2(svc.commission||0);
  if(commSupEl&&!commSupEl.disabled&&svc.commissionSupplier)commSupEl.value=svc.commissionSupplier;
  recalcDocLines();
}
function svcComboKey(e,input){
  const wrap=input.closest('.svc-combo');
  if(!wrap)return;
  const list=wrap.querySelector('.svc-list');
  const opts=[...list.querySelectorAll('.svc-opt:not(.muted)')];
  let idx=opts.findIndex(o=>o.classList.contains('active'));
  if(e.key==='ArrowDown'){
    e.preventDefault();
    if(idx<opts.length-1)idx++;else idx=0;
    opts.forEach(o=>o.classList.remove('active'));
    if(opts[idx]){opts[idx].classList.add('active');opts[idx].scrollIntoView({block:'nearest'});}
    wrap.classList.add('open');
  }else if(e.key==='ArrowUp'){
    e.preventDefault();
    if(idx>0)idx--;else idx=opts.length-1;
    opts.forEach(o=>o.classList.remove('active'));
    if(opts[idx]){opts[idx].classList.add('active');opts[idx].scrollIntoView({block:'nearest'});}
  }else if(e.key==='Enter'){
    e.preventDefault();
    const active=list.querySelector('.svc-opt.active')||opts[0];
    if(active&&!active.classList.contains('muted')){
      const name=active.getAttribute('data-val')||active.textContent||'';
      input.value=name;
      wrap.classList.remove('open');
      applyServiceRatesToRow(wrap.closest('tr'), name);
    }
  }else if(e.key==='Escape'){
    wrap.classList.remove('open');
  }
}

function lineAmount(it){
  const qty=Number(it.qty)||0, fee=Number(it.feesRate)!=null?Number(it.feesRate):Number(it.rate)||0;
  const sc=Number(it.sc)||0, comm=Number(it.comm)||0;
  // Amount = Qty × (Fees/Rate + Service Charge) + Commission
  return qty*(fee+sc)+comm;
}

function ensureCommissionSuppliers(){
  if(!Array.isArray(DB.commissionSuppliers))DB.commissionSuppliers=[];
  // Collect names already used on documents
  const used=new Set(DB.commissionSuppliers.map(s=>(s.name||'').trim()).filter(Boolean));
  const scan=(docs)=>{
    (docs||[]).forEach(d=>{(d.items||[]).forEach(it=>{
      const n=(it.commSupplier||'').trim();
      if(n)used.add(n);
    });});
  };
  scan(DB.invoices);scan(DB.quotations);scan(DB.workOrders);
  used.forEach(n=>{
    if(!DB.commissionSuppliers.some(s=>(s.name||'').toLowerCase()===n.toLowerCase())){
      DB.commissionSuppliers.push({id:uid(),name:n});
    }
  });
  DB.commissionSuppliers.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  return DB.commissionSuppliers;
}

function buildLineItemsTable(items,opts={}){
  const showDone=opts.showDone||false;
  const lockSaved=!!opts.lockSaved;

  const lockDoneOnly=!!opts.lockDoneOnly;
  let source=items&&items.length?items:[{id:lineId(),date:today(),servicePackage:'',walletSupplier:'',description:'',qty:1,feesRate:0,cost:0,sc:0,comm:0,commSupplier:'',done:false}];
  if(opts.hideInvoiced)source=source.filter(it=>!it.invoiced);
  const arr=source.length?source:[{id:lineId(),date:today(),servicePackage:'',walletSupplier:'',description:'',qty:1,feesRate:0,cost:0,sc:0,comm:0,commSupplier:'',done:false}];
  const rows=arr.map(it=>{
    let lock=false;
    if(it.invoiced)lock=true;
    else if(lockDoneOnly)lock=!!it.done; // completed work locked; incomplete unlocked
    else if(lockSaved)lock=!!it.id && it._new!==true;
    return lineRowHtml(it,showDone, lock);
  }).join('');
  return `<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:8px">

  <div class="table-wrap"><table class="doc-lines-table" style="font-size:12px;border-collapse:collapse;width:100%">
    <thead><tr>
      ${showDone?'<th>Done</th>':''}
      <th>Date</th><th>Service</th><th>Wallet/Supplier</th><th>Description</th>
      <th>Qty</th><th title="Unit fees">Fees/Rate</th><th>Cost</th><th title="Added to Fees then × Qty">SC</th><th>Comm. Supplier</th><th>Comm</th><th>Amount</th><th></th>
    </tr></thead>
    <tbody id="docLinesBody">${rows}</tbody>
  </table></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
    <button type="button" class="btn btn-outline btn-sm" onclick="addDocLine(${showDone})">+ Add Line</button>

function quickAddService(){
  const name=(prompt('New service name:')||'').trim();
  if(!name)return;
  if((DB.serviceItems||[]).some(s=>(s.name||'').toLowerCase()===name.toLowerCase())){
    toast('Service already exists — search and select it','info');
    return;
  }
  const code=(prompt('Service code (optional):')||'').trim();
  const fees=parseFloat(prompt('Fees / Rate (default 0):','0')||'0')||0;
  const cost=parseFloat(prompt('Cost (default 0):','0')||'0')||0;
  const sc=parseFloat(prompt('Service Charge / SC (default 0):','0')||'0')||0;
  const dept=(prompt('Department (optional):','OTHER')||'OTHER').trim()||'OTHER';
  let base=(code||name).replace(/[^A-Za-z0-9_]+/g,'_').slice(0,40);
  let sid='si_'+base;
  let n=1;
  while((DB.serviceItems||[]).some(s=>s.id===sid)){n++;sid='si_'+base+'_'+n;}
  const item={id:sid,name,code:code||'',department:dept,rate:fees,cost:cost,sc:sc,commission:0,commissionSupplier:'',accountCode:'4100'};
  if(!DB.serviceItems)DB.serviceItems=[];
  DB.serviceItems.push(item);
  DB.serviceItems.sort((a,b)=>(a.name||'').localeCompare(b.name||''));

function addDocLine(showDone){
  const tbody=document.getElementById('docLinesBody');if(!tbody)return;
  const tr=document.createElement('tr');
  // use helper then extract inner of tr - simpler append via insertAdjacentHTML
  tbody.insertAdjacentHTML('beforeend', lineRowHtml({id:lineId(),date:today(),qty:1,feesRate:0,cost:0,sc:0,comm:0,commSupplier:'',done:false}, !!showDone));
}
function recalcDocLines(){
  let sub=0, totalCost=0;
  document.querySelectorAll('#docLinesBody tr').forEach(tr=>{
    const qtyEl=tr.querySelector('.item-qty');
    const feeEl=tr.querySelector('.item-fee');
    const scEl=tr.querySelector('.item-sc');
    const commEl=tr.querySelector('.item-comm');
    const qty=parseFloat(qtyEl?.value)||0;
    const fee=parseFloat(feeEl?.value)||0;
    const sc=parseFloat(scEl?.value)||0;
    const comm=parseFloat(commEl?.value)||0;
    const amt=qty*(fee+sc)+comm;
    const cell=tr.querySelector('.item-amt');
    if(cell){
      const txt=formatMoney(amt);
      cell.textContent=txt;
      cell.title=txt;
    }
    sub+=amt;
  });
  const subEl=document.getElementById('f_subtotal');
  const taxRateEl=document.getElementById('f_taxRate');
  const taxAmtEl=document.getElementById('f_taxAmount');
  const fineEl=document.getElementById('f_totalFine');
  const discEl=document.getElementById('f_discount');
  const otherEl=document.getElementById('f_otherCharges');
  const totalEl=document.getElementById('f_total');
  if(subEl)subEl.value=sub.toFixed(2);
  const taxRate=taxRateEl?(parseFloat(taxRateEl.value)||0):0;
  const tax=sub*taxRate/100;
  if(taxAmtEl)taxAmtEl.value=tax.toFixed(2);
  const fine=fineEl?(parseFloat(fineEl.value)||0):0;
  const disc=discEl?(parseFloat(discEl.value)||0):0;
  const other=otherEl?(parseFloat(otherEl.value)||0):0;
  if(totalEl)totalEl.value=(sub+tax+fine-disc+other).toFixed(2);
}
function collectDocLines(){
  const items=[];
  document.querySelectorAll('#docLinesBody tr').forEach(tr=>{
    const description=tr.querySelector('.item-desc')?.value?.trim()||'';
    const qty=parseFloat(tr.querySelector('.item-qty')?.value)||0;
    const feesRate=parseFloat(tr.querySelector('.item-fee')?.value)||0;
    const cost=parseFloat(tr.querySelector('.item-cost')?.value)||0;
    const sc=parseFloat(tr.querySelector('.item-sc')?.value)||0;
    const comm=parseFloat(tr.querySelector('.item-comm')?.value)||0;
    const commSupplier=tr.querySelector('.item-commsup')?.value?.trim()||'';
    const date=tr.querySelector('.item-date')?.value||today();
    const servicePackage=tr.querySelector('.item-svc')?.value?.trim()||'';
    const walletSupplier=tr.querySelector('.item-ws')?.value||'';
    const doneEl=tr.querySelector('.item-done');
    const id=tr.dataset.lineId||lineId();
    const invoiceId=tr.dataset.invoiceId||'';
    const invoiceNumber=tr.dataset.invoiceNumber||'';
    const invoiceLineId=tr.dataset.invoiceLineId||'';
    const linked=!!invoiceId;
    const invoiced=(tr.dataset.invoiced==='1')||linked;
    if(description||servicePackage||qty||feesRate||cost||sc||comm){
      items.push({id,date,servicePackage,walletSupplier,description,qty,feesRate,rate:feesRate,cost,sc,comm,commSupplier,transNo:'',amount:qty*(feesRate+sc)+comm,done:doneEl?doneEl.checked:false,invoiced:!!invoiced,invoiceId:invoiceId||undefined,invoiceNumber:invoiceNumber||undefined,invoiceLineId:invoiceLineId||undefined});
    }
  });
  return items;
}
function validateDocLines(items,opts){
  opts=opts||{};
  // requireWallet: false for quotations; walletOnlyIfDone for work orders (incomplete lines skip wallet)
  const baseRequire=opts.requireWallet!==false;
  const walletOnlyIfDone=!!opts.walletOnlyIfDone;
  if(!items||!items.length){toast('Add at least one line item','error');return false;}
  for(let i=0;i<items.length;i++){
    const it=items[i];
    const row=i+1;
    if((it.commSupplier||'').trim() && !(Number(it.comm)>0)){
      toast('Row '+row+': Commission amount is required when Commission Supplier is selected','error');
      return false;
    }
    let needWallet=baseRequire;
    if(walletOnlyIfDone)needWallet=!!it.done; // only completed WO lines require wallet
    if(opts.requireWallet===false)needWallet=false;
    if(needWallet){
      const fee=Number(it.feesRate)||0;
      const cost=Number(it.cost)||0;
      if((fee>0||cost>0) && !(it.walletSupplier||'').trim()){
        toast('Row '+row+': Wallet/Supplier is required when Fees/Rate or Cost is greater than 0'+(walletOnlyIfDone?' on completed lines':''),'error');
        return false;
      }
    }
  }
  return true;
}
function confirmRemoveLine(btn){

  });
}

function unlockWorkOrderLineRow(tr){
  if(!tr)return false;
  const wasInvoiced=tr.dataset.invoiced==='1'||!!(tr.dataset.invoiceId||'');
  if(wasInvoiced)tr.dataset.wasInvoiced='1';
  tr.dataset.invoiced='0';
  tr.dataset.locked='0';
  tr.style.background='';
  tr.style.opacity='1';
  tr.querySelectorAll('input,select,textarea').forEach(function(el){
    el.removeAttribute('readonly');
    el.removeAttribute('disabled');
    el.disabled=false;
    el.readOnly=false;
    el.style.pointerEvents='';
    el.style.background='';
    el.onclick=null;
  });
  const svcInput=tr.querySelector('input.item-svc');
  if(svcInput&&!tr.querySelector('.svc-combo')){
    const name=svcInput.value||'';
    const wrap=document.createElement('div');
    wrap.innerHTML=serviceComboHtml(name);
    svcInput.replaceWith(wrap.firstChild);
  }
  const doneEl=tr.querySelector('.item-done');
  if(doneEl){doneEl.onclick=null;doneEl.style.pointerEvents='auto';}
  const lockBtn=tr.querySelector('button[onclick*="unlockWorkOrderLine"]');

function confirmUnlockWorkOrderLine(){

  }
  const btn=window._unlockLineBtn;
  const tr=btn&&btn.closest?btn.closest('tr'):null;
  if(!tr){hideUnlockPwdOverlay();return;}

function applyClientFilters(){
  const typeFilter=document.getElementById('filterClientType')?.value||'';
  const statusFilter=document.getElementById('filterClientStatus')?.value||'';
  const q=(document.getElementById('filterClientSearch')?.value||'').toLowerCase().trim();
  const companyId=document.getElementById('filterCompany')?.value||'';
  // Base list: all clients if type filter set, else page type list
  let filtered=DB.clients.slice();
  if(typeFilter)filtered=filtered.filter(c=>c.type===typeFilter);
  else if(window._clientType==='Establishment')filtered=filtered.filter(c=>c.type==='Establishment');
  else if(window._clientType==='WalkIn')filtered=filtered.filter(c=>c.type==='WalkIn');
  if(statusFilter)filtered=filtered.filter(c=>(c.status||'Active')===statusFilter);
  if(companyId)filtered=filtered.filter(c=>c.id===companyId);
  if(q){
    filtered=filtered.filter(c=>{
      const empNames=ensureClientEmployees(c).map(e=>(e.name||'').toLowerCase()).join(' ');
      const blob=[c.name,c.code,c.contact,c.phone,c.email,c.address,c.employeeName,empNames].join(' ').toLowerCase();
      return blob.includes(q);
    });
  }
  const isEst=(window._clientType==='Establishment')||typeFilter==='Establishment';
  const cols=window._currentCols;
  document.getElementById('tableArea').innerHTML=renderTable(filtered,cols);
}
function resetClientFilters(){
  const setVal=(id,v)=>{const el=document.getElementById(id);if(el)el.value=v;};
  setVal('filterClientType','');
  setVal('filterClientStatus','');
  setVal('filterClientSearch','');
  setVal('filterCompany','');
  applyClientFilters();
  toast('Filters reset','info');
}

function saveClientThenDoc(docType){
  const name=val('f_name');
  if(!name)return toast('Name required','error');
  const obj={name,contact:val('f_contact'),phone:val('f_phone'),email:val('f_email'),address:val('f_address'),type:val('f_type'),status:val('f_status'),balance:0};
  if(obj.type==='Establishment'){
    obj.employees=collectEmployeesFromForm();
    obj.employeeName=obj.employees.length?obj.employees[0].name:'';
  }else{obj.employees=[];obj.employeeName='';}
  let clientId=editId;
  if(editId){
    const idx=DB.clients.findIndex(x=>x.id===editId);
    obj.id=editId;obj.balance=DB.clients[idx].balance||0;obj.created=DB.clients[idx].created;
    DB.clients[idx]=obj;clientId=editId;
  }else{
    obj.id=uid();obj.created=today();DB.clients.push(obj);clientId=obj.id;
  }
  saveData();
  closeModal();
  toast('Client saved — opening '+docType);
  const prefill={clientId,clientName:obj.name,items:[{id:lineId(),description:'',qty:1,rate:0,amount:0,_new:true}]};
  if(docType==='quotation')openQuotationForm(null,prefill);
  else if(docType==='workOrder')openWorkOrderForm(null,prefill);
  else openInvoiceForm(null,prefill);
}

function saveClient(){const obj={name:val('f_name'),contact:val('f_contact'),phone:val('f_phone'),email:val('f_email'),address:val('f_address'),type:val('f_type'),status:val('f_status'),balance:0};
if(!obj.name)return toast('Name required','error');
if(obj.type==='Establishment'){
  obj.employees=collectEmployeesFromForm();
  obj.employeeName=obj.employees.length?obj.employees[0].name:'';
}else{
  obj.employees=[];
  obj.employeeName='';
  obj.code='';
}
if(editId){
  const idx=DB.clients.findIndex(x=>x.id===editId);
  const prev=DB.clients[idx];
  obj.id=editId;obj.balance=prev.balance||0;obj.created=prev.created;
  obj.code=prev.code||(obj.type==='Establishment'?assignCompanyCode():'');
  DB.clients[idx]=obj;
}else{
  obj.id=uid();obj.created=today();
  if(obj.type==='Establishment')obj.code=assignCompanyCode();
  DB.clients.push(obj);
}
saveData();closeModal();toast(obj.type==='Establishment'?('Company saved — Code '+obj.code):'Client saved');navigate(obj.type==='Establishment'?'establishments':'walkInCustomers');}
function assignCompanyCode(){
  const s=DB.settings||{};
  const prefix=s.companyPrefix||'CO';
  let n=Number(s.nextCompanyNo)||1001;
  // ensure unique
  const used=new Set((DB.clients||[]).map(c=>(c.code||'').toUpperCase()).filter(Boolean));
  let code=prefix+'-'+n;
  while(used.has(code.toUpperCase())){n++;code=prefix+'-'+n;}
  DB.settings.nextCompanyNo=n+1;
  return code;
}

function applyClientWorkFilters(clientId){
  const type=document.getElementById('cw_filterType')?.value||'';
  const q=(document.getElementById('cw_search')?.value||'').toLowerCase().trim();
  const root=document.getElementById('cw_sections');
  if(!root)return;
  const children=[...root.children];
  let i=0;
  while(i<children.length){
    const el=children[i];
    if(el.tagName==='H4'){
      const t=(el.textContent||'').toLowerCase();
      let key='';
      if(t.includes('work order'))key='wo';
      else if(t.includes('invoice'))key='inv';
      else if(t.includes('quotation'))key='qt';
      else if(t.includes('receipt'))key='rec';
      else if(t.includes('employee'))key='emp';
      const block=[el];
      let j=i+1;
      while(j<children.length&&children[j].tagName!=='H4'){block.push(children[j]);j++;}
      let show=true;
      if(key==='emp'){
        show=!type;
        if(q&&show)show=block.some(b=>(b.textContent||'').toLowerCase().includes(q));
      }else if(key){
        if(type&&type!==key)show=false;
        const tableWrap=block.find(b=>b.querySelector&&b.querySelector('tbody'));
        if(show&&tableWrap){
          tableWrap.querySelectorAll('tbody tr').forEach(tr=>{
            if(!q){tr.style.display='';return;}
            tr.style.display=(tr.textContent||'').toLowerCase().includes(q)?'':'none';
          });
        }else if(show&&q){
          show=block.some(b=>(b.textContent||'').toLowerCase().includes(q));
        }
      }
      block.forEach(b=>{b.style.display=show?'':'none';});
      i=j;
    }else i++;
  }
}

function suggestDocNumber(kind){
  const s=DB.settings||{};
  if(kind==='invoice')return (s.invoicePrefix||'INV')+'-'+(s.nextInvoiceNo||1001);
  if(kind==='quotation')return (s.quotationPrefix||'QT')+'-'+(s.nextQuotationNo||501);
  if(kind==='workOrder')return (s.workOrderPrefix||'WO')+'-'+(s.nextWorkOrderNo||201);
  return '';
}
function isDocNumberTaken(kind,number,excludeId){
  const n=String(number||'').trim().toLowerCase();
  if(!n)return false;
  let list=[];
  if(kind==='invoice')list=DB.invoices||[];
  else if(kind==='quotation')list=DB.quotations||[];
  else if(kind==='workOrder')list=DB.workOrders||[];
  return list.some(x=>x&&x.id!==excludeId&&String(x.number||'').trim().toLowerCase()===n);
}
function bumpCounterIfNeeded(kind,number){
  const s=DB.settings||{};
  const n=String(number||'');
  let prefix='', nextKey='';
  if(kind==='invoice'){prefix=s.invoicePrefix||'INV';nextKey='nextInvoiceNo';}
  else if(kind==='quotation'){prefix=s.quotationPrefix||'QT';nextKey='nextQuotationNo';}
  else if(kind==='workOrder'){prefix=s.workOrderPrefix||'WO';nextKey='nextWorkOrderNo';}
  else return;
  const escPref=prefix.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const re=new RegExp('^'+escPref+'-(\\d+)$','i');
  const m=n.match(re);
  if(m){
    const num=parseInt(m[1],10)+1;
    if(num>(Number(s[nextKey])||0))s[nextKey]=num;
  }
}

function removeInvoicePaymentReceipt(inv){
  if(!inv)return;
  const linked=[];
  if(inv.receiptId){const r=DB.receipts.find(x=>x.id===inv.receiptId);if(r)linked.push(r);}
  (DB.receipts||[]).forEach(r=>{if(r.invoiceId===inv.id&&!linked.some(x=>x.id===r.id))linked.push(r);});
  linked.forEach(r=>{removeReceiptAutomation(r);});
  const ids=new Set(linked.map(r=>r.id));
  DB.receipts=(DB.receipts||[]).filter(r=>!ids.has(r.id));
  inv.receiptId=null;
  const idx=DB.invoices.findIndex(x=>x.id===inv.id);
  if(idx>=0)DB.invoices[idx].receiptId=null;
}

function onInvoicePayTypeChange(){
  const type=val('pay_type')||'Cash';
  const sel=document.getElementById('pay_wallet');
  const label=document.getElementById('pay_wallet_label');
  if(!sel)return;
  if(type==='Bank'){
    if(label)label.textContent='Bank Account *';
    sel.innerHTML=window._payBankHtml||'<option value="">No banks</option>';
  }else{
    if(label)label.textContent='Cash Account';
    sel.innerHTML=window._payCashHtml||'<option value="">No cash wallets</option>';
  }
}

function cancelInvoicePayment(invId){
  const inv=DB.invoices.find(x=>x.id===invId);
  if(inv){
    inv.status='Pending';
    removeInvoicePaymentReceipt(inv);
    applyInvoiceAutomation(inv);
    refreshReportsData();
    saveData();
    toast('Payment cancelled — invoice set to Pending (customer balance updated)','info');
  }
  closeModal();
  navigate('invoices');
}

function confirmInvoicePayment(invId,preview){
  const inv=DB.invoices.find(x=>x.id===invId);
  if(!inv)return toast('Invoice not found','error');
  const amount=parseFloat(val('pay_amount'))||0;
  if(amount<=0)return toast('Enter payment amount','error');
  const payType=val('pay_type')||'Cash';
  const walletId=val('pay_wallet')||'';
  if(!walletId)return toast(payType==='Bank'?'Select a bank account':'Select a cash account','error');
  const wallet=(DB.wallets||[]).find(w=>w.id===walletId);
  if(!wallet)return toast('Wallet not found — add Cash/Bank under Wallets','error');
  // Remove any previous payment for this invoice
  removeInvoicePaymentReceipt(inv);
  const rec={
    id:uid(),
    date:val('pay_date')||today(),
    clientId:inv.clientId,
    clientName:inv.clientName,
    amount:amount,
    method:payType,
    walletId:walletId,
    reference:val('pay_ref')||('Payment for '+inv.number),
    notes:'Auto receipt for invoice '+inv.number,
    invoiceId:inv.id,
    invoiceNumber:inv.number
  };
  DB.receipts.push(rec);
  applyReceiptAutomation(rec);
  inv.receiptId=rec.id;
  inv.status='Paid';
  applyInvoiceAutomation(inv);
  refreshReportsData();
  saveData();
  closeModal();
  toast('Receipt saved — '+payType+' ('+wallet.name+') and customer account updated');
  if(preview)previewDocument('invoice',inv.id);
  else navigate('invoices');
}


/* ========== TRANSACTION AUTOMATION ENGINE ========== */
function txnRef(type,id){return type+':'+id;}
function removeJournalsByRef(ref){
  if(!ref)return;
  const keep=[];
  (DB.journalEntries||[]).forEach(j=>{
    if(j.txnRef===ref){
      if(j.status==='Posted')reverseAccountBalances(j);
    }else keep.push(j);
  });
  DB.journalEntries=keep;
}
function findCoaAccount(accountId){
  if(!accountId)return null;
  const s=String(accountId);
  return (DB.chartOfAccounts||[]).find(a=>a.id===s||a.code===s||String(a.id)===s||String(a.code)===s)||null;
}
function updateAccountBalances(entry){
  (entry.lines||[]).forEach(l=>{
    const acc=findCoaAccount(l.accountId);
    if(!acc)return;
    l.accountName=l.accountName||acc.name;
    if(['Asset','Expense'].includes(acc.type))acc.balance=(Number(acc.balance)||0)+(Number(l.debit)||0)-(Number(l.credit)||0);
    else acc.balance=(Number(acc.balance)||0)+(Number(l.credit)||0)-(Number(l.debit)||0);
  });
}
function reverseAccountBalances(entry){
  (entry.lines||[]).forEach(l=>{
    const acc=findCoaAccount(l.accountId);
    if(!acc)return;
    if(['Asset','Expense'].includes(acc.type))acc.balance=(Number(acc.balance)||0)-(Number(l.debit)||0)+(Number(l.credit)||0);
    else acc.balance=(Number(acc.balance)||0)-(Number(l.credit)||0)+(Number(l.debit)||0);
  });
}
function postTxnJournal(ref,date,memo,lines){
  try{
    if(!DB.journalEntries)DB.journalEntries=[];
    if(!DB.nextJournalNo||DB.nextJournalNo<1)DB.nextJournalNo=1;
    removeJournalsByRef(ref);
    const cleaned=(lines||[]).filter(l=>l&&l.accountId&&((Number(l.debit)||0)||(Number(l.credit)||0))).map(l=>({
      accountId:String(l.accountId),
      accountName:l.accountName||'',
      debit:Number(l.debit)||0,
      credit:Number(l.credit)||0
    }));
    if(cleaned.length<2)return null;
    // Ensure accounts exist for lines
    cleaned.forEach(l=>{
      if(!findCoaAccount(l.accountId)){
        // soft-create missing expense/asset placeholder only if numeric code known in seed range
        console.warn('COA account missing for journal line', l.accountId);
      }
    });
    const entry={id:uid(),number:'JE-'+(DB.nextJournalNo++),date:date||today(),memo:memo||'',lines:cleaned,status:'Posted',txnRef:ref};
    DB.journalEntries.push(entry);
    updateAccountBalances(entry);
    return entry;
  }catch(e){
    console.error('postTxnJournal',e);
    return null;
  }
}
function resolveWallet(methodOrId){
  const list=DB.wallets||[];
  if(!list.length)return null;
  if(!methodOrId)return list[0];
  const s=String(methodOrId);
  if(s.startsWith('W:')){const w=list.find(x=>x.id===s.slice(2));if(w)return w;}
  let w=list.find(x=>x.id===s);if(w)return w;
  w=list.find(x=>(x.name||'').toLowerCase()===s.toLowerCase());if(w)return w;
  if(/cash/i.test(s))return list.find(x=>/cash/i.test(x.type||'')||/cash/i.test(x.name||''))||list[0];
  if(/card|credit/i.test(s))return list.find(x=>/card|credit/i.test(x.type||'')||/card/i.test(x.name||''))||list[0];
  if(/bank|transfer|cheque|check/i.test(s))return list.find(x=>/bank/i.test(x.type||'')||/bank/i.test(x.name||''))||list[0];
  return list[0];
}
function cashOrBankAccountId(wallet){
  if(!wallet){
    const cash=(DB.chartOfAccounts||[]).find(a=>a.code==='1000'||a.id==='1000');
    return cash?(cash.id||'1000'):'1000';
  }
  try{ensureWalletCoaAccount(wallet);}catch(e){}
  if(wallet.coaAccountId){
    const acc=findCoaAccount(wallet.coaAccountId)||(DB.chartOfAccounts||[]).find(a=>a.id===wallet.coaAccountId||a.code===wallet.coaAccountId);
    if(acc)return acc.id||acc.code;
  }
  if(/card|credit/i.test(wallet.type||'')){
    const liab=(DB.chartOfAccounts||[]).find(a=>a.type==='Liability'&&/card|short/i.test(a.subtype||''));
    if(liab)return liab.id||liab.code;
  }
  if(/bank/i.test(wallet.type||'')||/bank/i.test(wallet.name||''))return '1100';
  return '1000';
}
function ensureWalletCoaAccount(wallet){
  if(!wallet||!wallet.name)return null;
  if(!DB.chartOfAccounts)DB.chartOfAccounts=[];
  const t=(wallet.type||'').toLowerCase();
  const n=(wallet.name||'').toLowerCase();
  const isCash=t==='cash'||/cash/i.test(n);
  const isBank=t==='bank'||(/bank/i.test(n)&&!/card/i.test(n));
  const isCard=t==='card'||t==='credit card'||t==='short-term liability'||t==='creditcard'||/card|credit/i.test(t)||(/card/i.test(n)&&!isCash);
  // Credit cards / short-term liability cards → Liability COA
  const coaType=isCard?'Liability':'Asset';
  const subtype=isCard?'Short-term Liability':(isCash?'Cash':(isBank?'Bank':'Current Asset'));
  let acc=null;
  if(wallet.coaAccountId){
    acc=DB.chartOfAccounts.find(a=>a.id===wallet.coaAccountId||a.code===wallet.coaAccountId);
  }
  if(!acc)acc=DB.chartOfAccounts.find(a=>a.walletId===wallet.id);
  if(!acc){
    acc=DB.chartOfAccounts.find(a=>(a.name||'').toLowerCase()===(wallet.name||'').toLowerCase()&&(a.type===coaType||a.type==='Asset'||a.type==='Liability'));
  }
  if(acc){
    acc.name=wallet.name;
    acc.type=coaType;
    acc.subtype=isCard?(acc.subtype==='Credit Card'?'Credit Card':'Short-term Liability'):subtype;
    if(isCard&&!acc.subtype)acc.subtype='Short-term Liability';
    acc.walletId=wallet.id;
    if(wallet.accountNo)acc.accountNo=wallet.accountNo;
    wallet.coaAccountId=acc.id||acc.code;
    return acc;
  }
  const used=new Set((DB.chartOfAccounts||[]).map(a=>String(a.code||a.id)));
  let codeNum=isCard?2101:(isCash?1001:1101);
  let code=String(codeNum);
  const max=isCard?2999:1999;
  while(used.has(code)&&codeNum<max){codeNum++;code=String(codeNum);}
  if(used.has(code))code='W'+String(wallet.id).replace(/\W/g,'').slice(-6);
  acc={
    id:code,
    code:code,
    name:wallet.name,
    type:coaType,
    subtype:isCard?'Short-term Liability':subtype,
    balance:Number(wallet.balance)||0,
    walletId:wallet.id,
    accountNo:wallet.accountNo||''
  };
  DB.chartOfAccounts.push(acc);
  wallet.coaAccountId=acc.id;
  return acc;
}
function syncAllWalletsToCoa(){
  (DB.wallets||[]).forEach(w=>{try{ensureWalletCoaAccount(w);}catch(e){}});
}

function adjustWallet(wallet,delta){
  if(!wallet)return;
  wallet.balance=(Number(wallet.balance)||0)+delta;
}
function reverseWalletEffect(doc){
  if(!doc||!doc._walletId||!doc._walletDelta)return;
  const w=(DB.wallets||[]).find(x=>x.id===doc._walletId);
  if(w)w.balance=(Number(w.balance)||0)-Number(doc._walletDelta);
  doc._walletId=null;doc._walletDelta=0;
}
function applyWalletEffect(doc,wallet,delta){
  reverseWalletEffect(doc);
  if(!wallet||!delta)return;
  adjustWallet(wallet,delta);
  doc._walletId=wallet.id;
  doc._walletDelta=delta;
}
function getExpenseAccounts(){
  return (DB.chartOfAccounts||[]).filter(a=>(a.type||'')==='Expense');
}
function findExpenseAccountByCode(code){
  return getExpenseAccounts().find(a=>String(a.code||a.id)===String(code));
}
function resolveExpenseAccount(categoryOrName){
  const raw=String(categoryOrName||'').trim();
  const list=getExpenseAccounts();
  if(!list.length)return {id:'5900',code:'5900',name:'Miscellaneous Expense'};
  if(!raw)return findExpenseAccountByCode('5900')||list[list.length-1];
  // Exact id / code / name
  let hit=list.find(a=>a.id===raw||String(a.code)===raw||(a.name||'')===raw);
  if(hit)return hit;
  const lower=raw.toLowerCase();
  hit=list.find(a=>(a.name||'').toLowerCase()===lower);
  if(hit)return hit;
  // Alias map → preferred COA code
  const aliases={
    'rent':'5200','rent expense':'5200','rental':'5200',
    'salaries':'5100','salary':'5100','salaries & wages':'5100','wages':'5100','payroll':'5100',
    'utilities':'5300','utility':'5300','electricity':'5300','water':'5300','internet':'5300',
    'office supplies':'5400','supplies':'5400','stationery':'5400',
    'commission':'5500','commission expense':'5500','commissions':'5500',
    'tax':'5600','tax expense':'5600','vat':'5600',
    'depreciation':'5700',
    'bank charges':'5800','bank charge':'5800','bank fees':'5800','finance charges':'5800',
    'miscellaneous':'5900','misc':'5900','general':'5900','other':'5900','travel':'5900','marketing':'5900',
    'service cost':'5000','cost of goods sold':'5000','cogs':'5000','direct cost':'5000','service costs':'5000'
  };
  const code=aliases[lower];
  if(code){
    hit=findExpenseAccountByCode(code);
    if(hit)return hit;
  }
  // Partial name match
  hit=list.find(a=>(a.name||'').toLowerCase().includes(lower)||lower.includes((a.name||'').toLowerCase()));
  if(hit)return hit;
  return findExpenseAccountByCode('5900')||list[list.length-1];
}
function expenseAccountId(category){
  const acc=resolveExpenseAccount(category);
  return acc.id||acc.code||'5900';
}
function reconfigureAllExpenses(){
  let n=0;
  (DB.expenses||[]).forEach(exp=>{
    if(!exp)return;
    const acc=resolveExpenseAccount(exp.category||exp.accountName||'');
    const prevCat=exp.category;
    exp.category=acc.name||prevCat;
    exp.accountId=acc.id||acc.code;
    exp.accountCode=acc.code||'';
    exp.accountName=acc.name||'';
    // Service-cost style auto expenses → COGS
    if(exp._auto||/service cost|cogs|direct cost/i.test(String(prevCat||''))){
      const cogs=findExpenseAccountByCode('5000')||resolveExpenseAccount('Cost of Goods Sold');
      if(cogs){exp.category=cogs.name;exp.accountId=cogs.id||cogs.code;exp.accountCode=cogs.code;exp.accountName=cogs.name;}
    }
    // Field remap only — journals are posted when expense is saved (avoid double-post on refresh)
    n++;
  });
  return n;
}

function reverseInvoiceCostWalletEffects(inv){
  if(!inv||!inv._costWalletDeltas)return;
  (inv._costWalletDeltas||[]).forEach(d=>{
    const w=(DB.wallets||[]).find(x=>x.id===d.walletId);
    if(w)w.balance=(Number(w.balance)||0)-Number(d.delta||0); // reverse prior delta
  });
  inv._costWalletDeltas=[];
}
function applyInvoiceCostAutomation(inv){
  if(!inv||!inv.id)return;
  const costRef=txnRef('invoice-cost',inv.id);
  reverseInvoiceCostWalletEffects(inv);
  if(inv.status==='Draft'||inv.status==='Cancelled'){
    removeJournalsByRef(costRef);
    return;
  }
  const cogs=coaRef('5000','Cost of Goods Sold','Expense','Cost of Goods Sold');
  const ap=coaRef('2000','Accounts Payable','Liability','Accounts Payable');
  const creditMap={};
  const walletDeltas={};
  (inv.items||[]).forEach(it=>{
    const cost=round2((Number(it.cost)||0)*(Number(it.qty)||1));
    if(cost<=0.0001)return;
    const ws=(it.walletSupplier||'').trim();
    let creditId=ap.id, creditName=ap.name;
    if(ws.startsWith('W:')){
      const w=resolveWallet(ws);
      if(w){
        try{ensureWalletCoaAccount(w);}catch(e){}
        creditId=cashOrBankAccountId(w);
        creditName=w.name||'Wallet';
        walletDeltas[w.id]=(walletDeltas[w.id]||0)-cost;
      }
    }
    if(!creditMap[creditId])creditMap[creditId]={name:creditName,amount:0};
    creditMap[creditId].amount=round2((creditMap[creditId].amount||0)+cost);
  });
  const totalCost=Object.values(creditMap).reduce((s,x)=>s+(Number(x.amount)||0),0);
  if(totalCost<=0.0001){
    removeJournalsByRef(costRef);
    return;
  }
  const lines=[
    {accountId:cogs.id,accountName:cogs.name,debit:round2(totalCost),credit:0}
  ];
  Object.keys(creditMap).forEach(aid=>{
    lines.push({accountId:aid,accountName:creditMap[aid].name,debit:0,credit:round2(creditMap[aid].amount)});
  });
  postTxnJournal(costRef,inv.date||today(),'Invoice line costs '+inv.number+' — COGS',lines);
  // Apply wallet balance reductions for costs paid from wallets
  inv._costWalletDeltas=[];
  Object.keys(walletDeltas).forEach(wid=>{
    const w=(DB.wallets||[]).find(x=>x.id===wid);
    const delta=walletDeltas[wid];
    if(w){
      w.balance=(Number(w.balance)||0)+delta;
      inv._costWalletDeltas.push({walletId:wid,delta:delta});
    }
  });
}
function coaRef(code,fallbackName,type,subtype){
  ensureCoreCoaAccounts();
  let acc=findCoaAccount(code);
  if(!acc){
    acc={id:String(code),code:String(code),name:fallbackName||('Account '+code),type:type||'Asset',subtype:subtype||'',balance:0};
    DB.chartOfAccounts.push(acc);
  }
  return {id:acc.id||acc.code,name:acc.name||fallbackName};
}
function applyInvoiceAutomation(inv){
  if(!inv||!inv.id)return;
  const ref=txnRef('invoice',inv.id);
  const commRef=txnRef('invoice-comm',inv.id);
  if(inv.status==='Draft'||inv.status==='Cancelled'){
    removeJournalsByRef(ref);
    removeJournalsByRef(commRef);
    applyInvoiceCostAutomation(inv);
    return;
  }
  // Line split: Fee → 4100, SC → 4150, Commission billed → AP 2000 (not revenue)
  let feeRev=0, scRev=0, commTotal=0;
  (inv.items||[]).forEach(it=>{
    const qty=Number(it.qty)||0;
    const fee=Number(it.feesRate!=null?it.feesRate:it.rate)||0;
    const sc=Number(it.sc)||0;
    const comm=Number(it.comm)||0;
    feeRev+=qty*fee;
    scRev+=qty*sc;
    commTotal+=comm;
  });
  const tax=Number(inv.taxAmount)||0;
  const fine=Number(inv.totalFine)||0;
  const disc=Number(inv.discount)||0;
  const other=Number(inv.otherCharges)||0;
  const total=Number(inv.total)||0;
  const ar=coaRef('1200','Accounts Receivable','Asset','Accounts Receivable');
  const rev=coaRef('4100','Service Revenue','Income','Service Revenue');
  const scInc=coaRef('4150','Service Charge Income','Income','Service Revenue');
  const taxPay=coaRef('2100','Tax Payable','Liability','Tax Payable');
  const ap=coaRef('2000','Accounts Payable','Liability','Accounts Payable');
  const otherInc=coaRef('4200','Other Income','Income','Other Income');
  const lines=[{accountId:ar.id,accountName:ar.name,debit:total,credit:0}];
  if(feeRev>0.0001)lines.push({accountId:rev.id,accountName:rev.name,debit:0,credit:round2(feeRev)});
  if(scRev>0.0001)lines.push({accountId:scInc.id,accountName:scInc.name,debit:0,credit:round2(scRev)});
  if(commTotal>0.0001)lines.push({accountId:ap.id,accountName:ap.name+' (Commission)',debit:0,credit:round2(commTotal)});
  if(tax>0.0001)lines.push({accountId:taxPay.id,accountName:taxPay.name,debit:0,credit:round2(tax)});
  // Explicit fine / other / discount
  if(fine>0.0001)lines.push({accountId:otherInc.id,accountName:otherInc.name+' (Fine)',debit:0,credit:round2(fine)});
  if(other>0.0001)lines.push({accountId:otherInc.id,accountName:otherInc.name,debit:0,credit:round2(other)});
  if(disc>0.0001)lines.push({accountId:otherInc.id,accountName:otherInc.name+' (Discount)',debit:round2(disc),credit:0});
  // Balance residual to Other Income / Expense so journal always balances
  let dr=lines.reduce((s,l)=>s+(Number(l.debit)||0),0);
  let cr=lines.reduce((s,l)=>s+(Number(l.credit)||0),0);
  const gap=round2(dr-cr);
  if(Math.abs(gap)>0.009){
    if(gap>0)lines.push({accountId:otherInc.id,accountName:otherInc.name,debit:0,credit:gap});
    else lines.push({accountId:otherInc.id,accountName:otherInc.name,debit:Math.abs(gap),credit:0});
  }
  postTxnJournal(ref,inv.date,'Invoice '+inv.number+' — '+(inv.clientName||''),lines);
  // Remove legacy separate commission JE (commission is on main invoice JE as AP)
  removeJournalsByRef(commRef);
  // Costs → 5000 COGS + Wallet/AP
  applyInvoiceCostAutomation(inv);
}
function round2(n){return Math.round((Number(n)||0)*100)/100;}

function applyReceiptAutomation(rec){
  if(!rec||!rec.id)return;
  const ref=txnRef('receipt',rec.id);
  const amt=Number(rec.amount)||0;
  if(amt<=0){removeJournalsByRef(ref);reverseWalletEffect(rec);return;}
  const wallet=resolveWallet(rec.walletId||rec.method);
  if(wallet)try{ensureWalletCoaAccount(wallet);}catch(e){}
  const cashAcc=cashOrBankAccountId(wallet);
  const cashName=(findCoaAccount(cashAcc)||{}).name||(wallet?wallet.name:'Cash');
  const ar=findCoaAccount('1200');
  if(!wallet){toast('Wallet not found for receipt — select a Wallet/Bank','error');return;}
  const je=postTxnJournal(ref,rec.date,'Receipt from '+(rec.clientName||'')+(rec.invoiceNumber?(' / '+rec.invoiceNumber):''),[
    {accountId:cashAcc,accountName:cashName,debit:amt,credit:0},
    {accountId:ar?(ar.id||ar.code||'1200'):'1200',accountName:ar?ar.name:'Accounts Receivable',debit:0,credit:amt}
  ]);
  if(!je){toast('Could not post receipt journal — check Chart of Accounts','error');return;}
  applyWalletEffect(rec,wallet,+amt);
}
function applyExpenseAutomation(exp){
  if(!exp||!exp.id)return;
  const ref=txnRef('expense',exp.id);
  const amt=round2(Number(exp.amount)||0);
  if(amt<=0){removeJournalsByRef(ref);reverseWalletEffect(exp);return;}
  const wallet=resolveWallet(exp.walletId||exp.paymentMethod);
  if(!wallet){toast('Wallet not found for expense — select a Wallet/Bank','error');return;}
  try{ensureWalletCoaAccount(wallet);}catch(e){}
  const cashAcc=cashOrBankAccountId(wallet);
  const cashName=(findCoaAccount(cashAcc)||{}).name||wallet.name||'Cash';
  // Prefer explicit accountId/code from form, else resolve by category name
  let acc=null;
  if(exp.accountId)acc=findCoaAccount(exp.accountId);
  if(!acc&&exp.accountCode)acc=findCoaAccount(exp.accountCode);
  if(!acc)acc=resolveExpenseAccount(exp.category||exp.accountName||'');
  if(!acc||!(acc.id||acc.code))acc=coaRef('5900','Miscellaneous Expense','Expense','Other Expense');
  else {
    // ensure in COA
    const id=acc.id||acc.code;
    if(!findCoaAccount(id))DB.chartOfAccounts.push({id:id,code:acc.code||id,name:acc.name||'Expense',type:'Expense',subtype:acc.subtype||'Operating Expense',balance:0});
    acc={id:id,name:acc.name||'Expense'};
  }
  exp.category=acc.name;
  exp.accountId=acc.id;
  exp.accountCode=acc.id;
  exp.accountName=acc.name;
  const je=postTxnJournal(ref,exp.date||today(),'Expense: '+acc.name,[
    {accountId:acc.id,accountName:acc.name,debit:amt,credit:0},
    {accountId:cashAcc,accountName:cashName,debit:0,credit:amt}
  ]);
  if(!je){toast('Could not post expense journal — check Chart of Accounts','error');return;}
  applyWalletEffect(exp,wallet,-amt);
}
function applyGenericMoneyAutomation(module,rec){
  if(!rec||!rec.id)return;
  const amt=Number(rec.amount)||0;
  const ref=txnRef(module,rec.id);
  if(amt<=0){removeJournalsByRef(ref);reverseWalletEffect(rec);return;}
  const wallet=resolveWallet(rec.walletId||rec.method||rec.paymentMethod);
  const cashAcc=cashOrBankAccountId(wallet);
  // creditPayments, refunds, taxPayments, dividends, chequePayments, loans — simplified
  if(module==='refunds'){
    postTxnJournal(ref,rec.date,'Refund',[
      {accountId:'1200',accountName:'Accounts Receivable',debit:amt,credit:0},
      {accountId:cashAcc,accountName:wallet?wallet.name:'Cash',debit:0,credit:amt}
    ]);
    applyWalletEffect(rec,wallet,-amt);
  }else if(module==='taxPayments'){
    postTxnJournal(ref,rec.date,'Tax Payment',[
      {accountId:'2100',accountName:'Tax Payable',debit:amt,credit:0},
      {accountId:cashAcc,accountName:wallet?wallet.name:'Cash',debit:0,credit:amt}
    ]);
    applyWalletEffect(rec,wallet,-amt);
  }else if(module==='dividends'){
    postTxnJournal(ref,rec.date,'Dividend',[
      {accountId:'3000',accountName:'Owner Equity',debit:amt,credit:0},
      {accountId:cashAcc,accountName:wallet?wallet.name:'Cash',debit:0,credit:amt}
    ]);
    applyWalletEffect(rec,wallet,-amt);
  }else if(module==='creditPayments'){
    postTxnJournal(ref,rec.date,'Credit Payment',[
      {accountId:'2000',accountName:'Accounts Payable',debit:amt,credit:0},
      {accountId:cashAcc,accountName:wallet?wallet.name:'Cash',debit:0,credit:amt}
    ]);
    applyWalletEffect(rec,wallet,-amt);
  }else if(module==='chequePayments'){
    postTxnJournal(ref,rec.date,'Cheque Payment',[
      {accountId:'2000',accountName:'Accounts Payable',debit:amt,credit:0},
      {accountId:cashAcc,accountName:wallet?wallet.name:'Cash',debit:0,credit:amt}
    ]);
    applyWalletEffect(rec,wallet,-amt);
  }
}
function recalcClientBalances(){
  (DB.clients||[]).forEach(c=>{
    const invTotal=(DB.invoices||[]).filter(i=>i.clientId===c.id&&i.status!=='Cancelled'&&i.status!=='Draft')
      .reduce((s,i)=>s+(Number(i.total)||0),0);
    const recTotal=(DB.receipts||[]).filter(r=>r.clientId===c.id)
      .reduce((s,r)=>s+(Number(r.amount)||0),0);
    const refundTotal=(DB.refunds||[]).filter(r=>r.clientId===c.id)
      .reduce((s,r)=>s+(Number(r.amount)||0),0);
    c.balance=invTotal-recTotal+refundTotal;
  });
}
function ensureCoreCoaAccounts(){
  if(!DB.chartOfAccounts)DB.chartOfAccounts=[];
  const need=defaultData.chartOfAccounts||[];
  need.forEach(tpl=>{

    }
  });
}
function rebuildCoaBalancesFromJournals(){

}

function syncExpensesFromPaidDocs(){
  // Mirror invoice line costs into Expenses list (journals already posted via invoice-cost)
  const auto=[];
  (DB.invoices||[]).forEach(inv=>{
    if(!inv||inv.status==='Cancelled'||inv.status==='Draft')return;
    (inv.items||[]).forEach((it,idx)=>{
      const cost=(Number(it.cost)||0)*(Number(it.qty)||1);
      if(cost<=0)return;
      const cogs=findExpenseAccountByCode('5000')||resolveExpenseAccount('Cost of Goods Sold')||{id:'5000',code:'5000',name:'Cost of Goods Sold'};
      auto.push({
        id:'exp_auto_'+inv.id+'_'+(it.id||idx),
        date:it.date||inv.date||today(),
        category:cogs.name||'Cost of Goods Sold',
        accountId:cogs.id||cogs.code||'5000',
        accountCode:cogs.code||'5000',
        accountName:cogs.name||'Cost of Goods Sold',
        amount:cost,
        paymentMethod:it.walletSupplier||'Supplier',
        walletId:(it.walletSupplier||'').startsWith('W:')?(it.walletSupplier||'').slice(2):'',
        description:(it.servicePackage||it.description||'Cost')+' — '+inv.number,
        invoiceNumber:inv.number,
        _auto:true,
        _fromInvoiceCost:true
      });
    });
  });
  DB.expenses=[..._keepManual(DB.expenses),...auto];
}


function _keepManual(arr){
  return (arr||[]).filter(x=>!x._auto);
}

function invoicePaidAmount(inv){
  if(!inv)return 0;
  if(inv.status==='Paid')return Number(inv.total)||0;
  let paid=0;
  (DB.receipts||[]).forEach(r=>{
    if(r.invoiceId===inv.id)paid+=Number(r.amount)||0;
  });
  // Cap at total
  const tot=Number(inv.total)||0;
  return Math.min(paid, tot);
}

function syncServiceTransactions(){
  const auto=[];
  const pushLine=(doc,source,it,idx)=>{
    const svc=it.servicePackage||it.description||'';
    if(!svc&&!(Number(it.amount)||Number(it.feesRate)||Number(it.sc)))return;
    const amt=Number(it.amount)!=null&&it.amount!==''?Number(it.amount):lineAmount(it);
    // Prefer invoice as source when line was converted from WO
    let src=source;
    let ref=doc.number||'';
    let workOrderRef='';
    if(source==='invoice'){
      src='invoice';
      workOrderRef=doc.workOrderNumber||it.workOrderNumber||'';
    }else if(source==='workOrder'){
      if(it.invoiced||it.invoiceId||it.invoiceNumber)return; // safety: never list converted WO lines
      src='workOrder';
    }
    auto.push({
      id:'st_auto_'+src+'_'+doc.id+'_'+(it.id||idx),
      date:it.date||doc.date||today(),
      client:doc.clientName||'',
      clientId:doc.clientId||'',
      description:it.description||svc,
      service:svc,
      amount:amt,
      cost:Number(it.cost)||0,
      sc:Number(it.sc)||0,
      feesRate:Number(it.feesRate!=null?it.feesRate:it.rate)||0,
      supplier:it.walletSupplier||'',
      ref:ref,
      source:src,
      status:doc.status||'',
      employeeName:doc.employeeName||'',
      workOrderRef:workOrderRef,
      invoiceRef:src==='invoice'?ref:'',
      _auto:true
    });
  };
  // 1) Invoices always win — show invoice lines (from WO convert or created upfront)
  (DB.invoices||[]).forEach(inv=>{
    if(!inv||inv.status==='Cancelled'||inv.status==='Draft')return;
    (inv.items||[]).forEach((it,idx)=>pushLine(inv,'invoice',it,idx));
  });
  // 2) Work orders — only lines NOT yet invoiced (avoid duplicate after convert)
  (DB.workOrders||[]).forEach(wo=>{
    if(!wo||wo.status==='Cancelled')return;
    (wo.items||[]).forEach((it,idx)=>{
      if(it.invoiced||it.invoiceId||it.invoiceNumber)return; // already on an invoice — do not show WO line
      pushLine(wo,'workOrder',it,idx);
    });
  });
  // Quotations are not listed once a WO/Invoice path is used (WO or Invoice covers the work)
  DB.serviceTransactions=[..._keepManual(DB.serviceTransactions),...auto];
}

function syncCommissionsFromDocs(){
  const auto=[];
  (DB.invoices||[]).forEach(inv=>{
    if(inv.status==='Cancelled'||inv.status==='Draft')return;
    (inv.items||[]).forEach((it,idx)=>{
      const amt=Number(it.comm)||0;
      const sup=(it.commSupplier||'').trim();
      if(amt<=0&&!sup)return;
      if(amt<=0)return;
      auto.push({
        id:'comm_auto_'+inv.id+'_'+(it.id||idx),
        date:it.date||inv.date||today(),
        user:inv.employeeName||'',
        client:inv.clientName||'',
        clientId:inv.clientId||'',
        amount:amt,
        supplier:sup,
        invoiceNumber:inv.number||'',
        invoiceId:inv.id,
        service:it.servicePackage||it.description||'',
        status:inv.status==='Paid'?'Paid':'Pending',
        _auto:true
      });
    });
  });
  DB.commissions=[..._keepManual(DB.commissions),...auto];
}

function syncCreditPaymentsFromInvoices(){
  const auto=[];
  (DB.invoices||[]).forEach(inv=>{
    if(!inv||inv.status==='Cancelled'||inv.status==='Draft'||inv.status==='Paid')return;
    const total=Number(inv.total)||0;
    const paid=invoicePaidAmount(inv);
    const balance=Math.max(0, total-paid);
    if(balance<=0.009)return;
    auto.push({
      id:'cr_auto_'+inv.id,
      date:inv.date||today(),
      client:inv.clientName||'',
      clientId:inv.clientId||'',
      clientName:inv.clientName||'',
      invoiceNumber:inv.number||'',
      invoiceId:inv.id,
      invoiceAmount:total,
      amount:balance,
      paid:paid,
      method:'Credit',
      status:paid>0.009?'Partial':'Pending',
      _auto:true
    });
  });
  DB.creditPayments=[..._keepManual(DB.creditPayments),...auto];
}

function syncDiscountsFromInvoices(){
  const auto=[];
  (DB.invoices||[]).forEach(inv=>{
    if(!inv||inv.status==='Cancelled')return;
    const disc=Number(inv.discount)||0;
    if(disc<=0)return;
    auto.push({
      id:'disc_auto_'+inv.id,
      date:inv.date||today(),
      client:inv.clientName||'',
      clientId:inv.clientId||'',
      clientName:inv.clientName||'',
      invoiceNumber:inv.number||'',
      invoiceId:inv.id,
      amount:disc,
      reason:'Invoice discount',
      _auto:true
    });
  });
  DB.discounts=[..._keepManual(DB.discounts),...auto];
}

function syncRefundsFromDocs(){
  const auto=[];
  // Cancelled invoices that had receipts → refund due
  (DB.invoices||[]).forEach(inv=>{
    if(inv.status!=='Cancelled')return;
    const paid=invoicePaidAmount(inv);
    if(paid<=0.009)return;
    auto.push({
      id:'ref_auto_cancel_'+inv.id,
      date:inv.date||today(),
      client:inv.clientName||'',
      clientId:inv.clientId||'',
      amount:paid,
      reason:'Cancelled invoice '+inv.number,
      invoiceNumber:inv.number||'',
      status:'Pending',
      _auto:true
    });
  });
  // Overpayment: receipts for invoice exceed total
  (DB.invoices||[]).forEach(inv=>{
    if(inv.status==='Cancelled'||inv.status==='Draft')return;
    let recSum=0;
    (DB.receipts||[]).forEach(r=>{if(r.invoiceId===inv.id)recSum+=Number(r.amount)||0;});
    const tot=Number(inv.total)||0;
    const excess=recSum-tot;
    if(excess>0.009){
      auto.push({
        id:'ref_auto_excess_'+inv.id,
        date:today(),
        client:inv.clientName||'',
        clientId:inv.clientId||'',
        amount:excess,
        reason:'Excess receipt on '+inv.number,
        invoiceNumber:inv.number||'',
        status:'Pending',
        _auto:true
      });
    }
  });
  DB.refunds=[..._keepManual(DB.refunds),...auto];
}

function syncSupplierBalancesFromDocs(){
  const map={}; // name -> amount (cost exposure)
  const add=(name,amt)=>{
    const k=(name||'').trim();
    if(!k||k.startsWith('W:'))return;
    map[k]=(map[k]||0)+(Number(amt)||0);
  };
  (DB.invoices||[]).forEach(inv=>{
    if(inv.status==='Cancelled'||inv.status==='Draft')return;
    (inv.items||[]).forEach(it=>{
      add(it.walletSupplier, (Number(it.cost)||0)*(Number(it.qty)||1));
    });
  });
  (DB.suppliers||[]).forEach(s=>{
    const name=(s.name||'').trim();
    s.balance=map[name]||0;
  });
  // Auto-create supplier shells for names used but not in list
  Object.keys(map).forEach(name=>{
    if(!(DB.suppliers||[]).some(s=>(s.name||'').toLowerCase()===name.toLowerCase())){
      DB.suppliers.push({id:uid(),name,contact:'',phone:'',email:'',balance:map[name],status:'Active',_auto:true});
    }
  });
}

function rebuildWalletBalancesFromTxns(){
  (DB.wallets||[]).forEach(w=>{
    if(w.openingBalance==null)w.openingBalance=0;
    let bal=Number(w.openingBalance)||0;
    (DB.receipts||[]).forEach(r=>{
      if((r.walletId===w.id)||(r._walletId===w.id))bal+=(Number(r.amount)||0);
    });
    (DB.expenses||[]).forEach(e=>{
      if((e.walletId===w.id)||(e._walletId===w.id))bal-=(Number(e.amount)||0);
    });
    // Generic money out
    ['taxPayments','dividends','creditPayments','chequePayments','refunds'].forEach(mod=>{
      (DB[mod]||[]).forEach(rec=>{
        if(rec._auto)return; // derived credit list is not cash movement
        if((rec.walletId===w.id)||(rec._walletId===w.id))bal-=(Number(rec.amount)||0);
      });
    });
    w.balance=bal;
  });
}

function matchDateRange(dateStr,from,to){
  if(from&&dateStr&&dateStr<from)return false;
  if(to&&dateStr&&dateStr>to)return false;
  return true;
}
function textMatch(obj,q,keys){
  if(!q)return true;
  const blob=keys.map(k=>String(obj[k]||'')).join(' ').toLowerCase();
  return blob.includes(q);
}

    </tr></thead><tbody>${rows}</tbody></table></div>`,
    `<button class="btn btn-outline" onclick="closeModal()">Cancel</button>${woBtn}<button class="btn btn-success" onclick="doConvertQuotation('${qtId}','invoice')">→ Invoice</button>${bothBtn}`,

function doConvertQuotation(qtId,mode){
  const q=DB.quotations.find(x=>x.id===qtId);if(!q)return;
  const alreadyWO=!!(q.workOrderId||(DB.workOrders||[]).some(w=>w.quotationId===q.id));
  if((mode==='wo'||mode==='both')&&alreadyWO){
    return toast('This quotation was already converted to a Work Order. Duplicate conversion is not allowed.','error');
  }
  const selected=[];
  document.querySelectorAll('.conv-item').forEach(c=>{
    if(c.checked){
      const it=q.items[parseInt(c.dataset.idx,10)];
      if(it)selected.push({...it,id:lineId(),done:false});
    }
  });
  if(!selected.length)return toast('Select at least one line','error');
  const subtotal=selected.reduce((s,i)=>s+(Number(i.amount)||lineAmount(i)),0);
  const taxRate=q.taxRate??DB.settings.taxRate;const taxAmount=subtotal*taxRate/100;const total=subtotal+taxAmount;
  let woId=null,woNumber=null;
  const empName=q.employeeName||getClientEmployeeName(q.clientId)||'';
  if(mode==='wo'||mode==='both'){
    const wo={id:uid(),number:DB.settings.workOrderPrefix+'-'+(DB.settings.nextWorkOrderNo++),clientId:q.clientId,clientName:q.clientName,employeeName:empName,date:today(),status:'Pending',items:selected.map(i=>({...i,done:false,invoiced:false})),subtotal,taxRate,taxAmount,total,notes:'Converted from '+q.number,quotationId:q.id,quotationNumber:q.number};
    DB.workOrders.push(wo);
    woId=wo.id;woNumber=wo.number;
    q.workOrderId=woId;
    q.workOrderNumber=woNumber;
  }
  if(mode==='invoice'||mode==='both'){
    const inv={id:uid(),number:DB.settings.invoicePrefix+'-'+(DB.settings.nextInvoiceNo++),clientId:q.clientId,clientName:q.clientName,employeeName:empName,date:today(),dueDate:'',status:'Pending',items:selected.map(i=>({...i,id:lineId()})),subtotal,taxRate,taxAmount,total,notes:'Converted from '+q.number+(woNumber?' / '+woNumber:''),quotationId:q.id,quotationNumber:q.number,workOrderId:woId,workOrderNumber:woNumber};
    DB.invoices.push(inv);postInvoiceJournal(inv);logActivity('convert','Work Order '+(wo.number||'')+' → Invoice '+inv.number);
  }
  q.status='Accepted';
  refreshReportsData();saveData();closeModal();toast('Converted successfully');
  if(mode==='wo')navigate('workOrders');else navigate('invoices');
}

function syncInvoiceLineFromWorkOrderItem(woLine){
  if(!woLine||!woLine.invoiceId)return false;
  const inv=DB.invoices.find(i=>i.id===woLine.invoiceId);
  if(!inv)return false;
  if(!inv.items)inv.items=[];
  let line=null;
  if(woLine.invoiceLineId)line=inv.items.find(x=>x.id===woLine.invoiceLineId);
  if(!line)line=inv.items.find(x=>(x.servicePackage||'')===(woLine.servicePackage||'')&&(x.description||'')===(woLine.description||''));
  const payload={
    date:woLine.date||inv.date,
    servicePackage:woLine.servicePackage||'',
    walletSupplier:woLine.walletSupplier||'',
    description:woLine.description||'',
    qty:Number(woLine.qty)||0,
    feesRate:Number(woLine.feesRate)||0,
    rate:Number(woLine.feesRate)||0,
    cost:Number(woLine.cost)||0,
    sc:Number(woLine.sc)||0,
    comm:Number(woLine.comm)||0,
    commSupplier:woLine.commSupplier||'',
    amount:Number(woLine.amount)!=null?Number(woLine.amount):lineAmount(woLine)
  };
  if(line){Object.assign(line,payload);}
  else{
    const nid=woLine.invoiceLineId||lineId();
    inv.items.push(Object.assign({id:nid},payload));
    woLine.invoiceLineId=nid;
  }
  const sub=inv.items.reduce((s,i)=>s+(Number(i.amount)||0),0);
  const fine=Number(inv.totalFine)||0;
  const disc=Number(inv.discount)||0;
  const other=Number(inv.otherCharges)||0;
  const taxRate=Number(inv.taxRate)||0;
  const taxAmount=inv.hideTax?0:(sub*taxRate/100);
  inv.subtotal=sub;inv.taxAmount=taxAmount;inv.total=sub+taxAmount+fine-disc+other;
  try{if(typeof applyInvoiceAutomation==='function')applyInvoiceAutomation(inv);}catch(e){}
  return true;
}
function saveWorkOrder(){const clientId=val('f_clientId');if(!clientId)return toast('Select a client','error');const client=DB.clients.find(c=>c.id===clientId);const formItems=collectDocLines();

// Restore invoice linkage from existing; re-lock any invoice-linked line
formItems.forEach(it=>{
  const prev=existing.find(x=>x.id===it.id);
  if(prev){
    if(!it.invoiceId&&prev.invoiceId){it.invoiceId=prev.invoiceId;it.invoiceNumber=prev.invoiceNumber;it.invoiceLineId=prev.invoiceLineId;}
  }
  if(it.invoiceId){it.invoiced=true;it.done=true;}
});
const items=[...formItems,...missing];
const seen=new Set();const merged=[];

logActivity('work_order_save','Work order saved');saveData();closeModal();toast(invUpdated?('Work Order saved — '+invUpdated+' invoice line(s) updated'):'Work Order saved');navigate('workOrders');}

function editPreviewNotes(){

function togglePreviewTax(){
  const st=window._previewTax;
  if(!st)return;
  st.hideTax=!st.hideTax;
  const line=document.getElementById('printTaxLine');
  const grand=document.getElementById('printGrandTotal');
  const btn=document.getElementById('previewTaxToggleBtn');
  // Display-only toggle for print: does not change saved document totals
  if(line){
    if(st.hideTax){
      line.style.display='none';
    }else{
      const amt=st.taxAmount||0;
      const rate=st.taxRate||0;
      line.innerHTML=`<span>Tax (${rate}%)</span><span>${formatMoney(amt)}</span>`;
      line.style.display=(!rate && !amt)?'none':'flex';
      line.style.justifyContent='space-between';
      line.style.gap='24px';
    }
  }
  if(btn)btn.textContent=st.hideTax?'Show Tax on Print':'Hide Tax on Print';
  if(grand){
    if(st.hideTax){
      const withoutTax=(st.subtotal||0)+(st.totalFine||0)-(st.discount||0)+(st.otherCharges||0);
      grand.innerHTML=`<span>Grand Total</span><span>${formatMoney(withoutTax)}</span>`;
      const aw=document.getElementById('printAmountWords');if(aw)aw.innerHTML=`<strong>Amount in words:</strong> ${esc(numberToWords(withoutTax))}`;

}

function saveWallet(){
  const obj={
    name:val('f_name'),
    type:val('f_type')||'Bank',
    openingBalance:parseFloat(val('f_balance'))||0,
    balance:parseFloat(val('f_balance'))||0,
    accountNo:val('f_accountNo')||''
  };
  if(!obj.name)return toast('Name required','error');
  if(editId){
    const idx=DB.wallets.findIndex(x=>x.id===editId);
    obj.id=editId;
    if(DB.wallets[idx]){
      // keep computed balance structure; opening updated then rebuild
      obj.openingBalance=parseFloat(val('f_balance'))||0;
    }
    DB.wallets[idx]=obj;
  }else{
    obj.id=uid();
    if(!DB.wallets)DB.wallets=[];
    DB.wallets.push(obj);
  }
  try{ensureWalletCoaAccount(obj);}catch(e){}
  try{rebuildWalletBalancesFromTxns();}catch(e){}
  try{refreshReportsData();}catch(e){}
  saveData();
  closeModal();
  toast('Wallet / Bank saved — added to Chart of Accounts');
  // Refresh any open wallet dropdowns on current form
  refreshWalletDropdowns(obj.id);
  if(typeof navigate==='function'&&document.getElementById('contentArea')&&(editModule==='wallets'))navigate('wallets');
}
function refreshWalletDropdowns(selectId){
  document.querySelectorAll('select#f_walletId, select#pay_wallet, select.item-ws').forEach(sel=>{
    if(!sel)return;
    const cur=selectId||sel.value;
    if(sel.id==='f_walletId'||sel.id==='pay_wallet'){
      const keep=sel.querySelector('option[value=""]');
      sel.innerHTML=(keep?keep.outerHTML:'<option value="">— Select —</option>')+walletSelectOpts(cur);
      if(cur)sel.value=cur;
    }
  });
}
function quickAddWallet(selectId){
  const name=(prompt('New wallet / bank name:')||'').trim();
  if(!name)return;
  if((DB.wallets||[]).some(w=>(w.name||'').toLowerCase()===name.toLowerCase())){
    toast('Wallet already exists','info');
    return;
  }
  const typeAns=(prompt('Type: Cash / Bank / Credit Card (default Bank):','Bank')||'Bank').trim();
  let type='Bank';
  const t=typeAns.toLowerCase();
  if(t.includes('cash'))type='Cash';
  else if(t.includes('card')||t.includes('credit')||t.includes('liab'))type='Card';
  else if(t.startsWith('b'))type='Bank';
  else if(typeAns)type=typeAns;
  const opening=parseFloat(prompt('Opening balance (default 0):','0')||'0')||0;
  const w={id:uid(),name,type,openingBalance:opening,balance:opening,accountNo:''};
  if(!DB.wallets)DB.wallets=[];
  DB.wallets.push(w);
  try{ensureWalletCoaAccount(w);}catch(e){}
  saveData();
  toast('Wallet added: '+name+' (COA updated)');

function applyReceiptToInvoice(rec,forceComplete){
  if(!rec||!rec.invoiceId)return;
  const inv=DB.invoices.find(x=>x.id===rec.invoiceId);
  if(!inv||inv.status==='Cancelled')return;
  rec.invoiceNumber=inv.number;
  inv.receiptId=rec.id;
  const bal=invoiceBalanceDue(inv);
  // After this receipt is already in DB, balance may include it — recompute without double count carefully
  const total=Number(inv.total)||0;
  let paid=0;
  (DB.receipts||[]).forEach(r=>{if(r.invoiceId===inv.id)paid+=Number(r.amount)||0;});
  const remaining=Math.max(0,total-paid);
  const complete=forceComplete||document.getElementById('f_complete_invoice')?.checked;
  if(remaining<=0.009||(complete&&(Number(rec.amount)||0)>=total-0.009)){
    inv.status='Paid';
  }else if(paid>0.009){
    inv.status='Partial';
  }else{
    inv.status='Pending';
  }
  try{applyInvoiceAutomation(inv);}catch(e){}
}

const COA_SUBTYPES={
  Asset:['Current Asset','Fixed Asset','Bank','Cash','Accounts Receivable','Inventory','Other Asset'],
  Liability:['Current Liability','Short-term Liability','Credit Card','Long-term Liability','Accounts Payable','Tax Payable','Other Liability'],
  Equity:['Owner Equity','Retained Earnings','Capital','Drawings','Other Equity'],
  Income:['Operating Income','Service Revenue','Sales','Other Income'],
  Expense:['Direct Cost','Operating Expense','Cost of Goods Sold','Administrative','Financial','Other Expense']
};
function getCustomCoaSubtypes(){
  if(!DB.settings)DB.settings={};
  if(!DB.settings.customCoaSubtypes||typeof DB.settings.customCoaSubtypes!=='object'){
    DB.settings.customCoaSubtypes={Asset:[],Liability:[],Equity:[],Income:[],Expense:[]};
  }
  ['Asset','Liability','Equity','Income','Expense'].forEach(t=>{
    if(!Array.isArray(DB.settings.customCoaSubtypes[t]))DB.settings.customCoaSubtypes[t]=[];
  });
  return DB.settings.customCoaSubtypes;
}
function subtypesForType(type){
  const base=(COA_SUBTYPES[type]||COA_SUBTYPES.Expense).slice();
  const custom=getCustomCoaSubtypes()[type]||[];
  custom.forEach(s=>{if(s&&!base.includes(s))base.push(s);});
  // Also include subtypes already used on accounts of this type
  (DB.chartOfAccounts||[]).forEach(a=>{
    if((a.type||'')===type&&a.subtype&&!base.includes(a.subtype))base.push(a.subtype);
  });
  return base;
}
function subtypeOptionsForType(type,selected){
  const list=subtypesForType(type);
  let opts=list.map(s=>`<option value="${esc(s)}" ${selected===s?'selected':''}>${esc(s)}</option>`).join('');
  if(selected&&!list.includes(selected)){
    opts=`<option value="${esc(selected)}" selected>${esc(selected)} (custom)</option>`+opts;
  }
  return `<option value="">— Select subtype —</option>`+opts;
}

function getPendingJobsForYearEnd(){
  // Work orders with non-invoiced lines only
  const pendingWO=[];
  (DB.workOrders||[]).forEach(wo=>{
    const pending=(wo.items||[]).filter(it=>!it.invoiced);
    if(!pending.length)return;
    pendingWO.push({
      id:wo.id,number:wo.number,clientId:wo.clientId,clientName:wo.clientName,
      employeeName:wo.employeeName||'',date:wo.date,status:wo.status||'Pending',
      notes:wo.notes||'',quotationId:wo.quotationId||null,quotationNumber:wo.quotationNumber||null,
      items:pending.map(it=>({...it,invoiced:false,done:!!it.done}))
    });
  });
  // Unpaid / pending invoices (outstanding AR)
  const pendingInv=(DB.invoices||[]).filter(i=>i.status!=='Paid'&&i.status!=='Cancelled').map(i=>({
    id:i.id,number:i.number,clientId:i.clientId,clientName:i.clientName,
    employeeName:i.employeeName||'',date:i.date,dueDate:i.dueDate||'',status:i.status||'Pending',
    items:i.items||[],subtotal:i.subtotal,taxRate:i.taxRate,taxAmount:i.taxAmount,total:i.total,
    notes:i.notes||'',workOrderId:i.workOrderId||null,workOrderNumber:i.workOrderNumber||null
  }));
  // Open quotations not accepted/rejected
  const pendingQt=(DB.quotations||[]).filter(q=>q.status!=='Accepted'&&q.status!=='Rejected').map(q=>({
    id:q.id,number:q.number,clientId:q.clientId,clientName:q.clientName,
    employeeName:q.employeeName||'',date:q.date,validUntil:q.validUntil||'',status:q.status||'Draft',
    items:q.items||[],subtotal:q.subtotal,taxRate:q.taxRate,taxAmount:q.taxAmount,total:q.total,notes:q.notes||''
  }));
  return {workOrders:pendingWO,invoices:pendingInv,quotations:pendingQt};
}

function performYearEndClose(){if(!confirm('Close the fiscal year? Backup recommended.'))return;const lines=[];let totalIncome=0,totalExpense=0;
DB.chartOfAccounts.filter(a=>a.type==='Income'&&a.balance).forEach(a=>{lines.push({accountId:a.id,accountName:a.name,debit:a.balance,credit:0});totalIncome+=a.balance;});
DB.chartOfAccounts.filter(a=>a.type==='Expense'&&a.balance).forEach(a=>{lines.push({accountId:a.id,accountName:a.name,debit:0,credit:a.balance});totalExpense+=a.balance;});
const net=totalIncome-totalExpense;if(net>=0)lines.push({accountId:'3100',accountName:'Retained Earnings',debit:0,credit:net});else lines.push({accountId:'3100',accountName:'Retained Earnings',debit:Math.abs(net),credit:0});
if(lines.length<2)return toast('Nothing to close','info');const entry={id:uid(),number:'JE-CLOSE-'+(DB.nextJournalNo++),date:today(),memo:'Year-End Closing Entry',lines,status:'Posted'};updateAccountBalances(entry);DB.journalEntries.push(entry);saveData();toast('Year-end closing completed');navigate('yearEndClosing');}

  });
  csv+='\nPENDING WORK ORDERS\nWO Number,Client,Date,Status,Service,Description,Qty,Fees,SC,Comm,Amount,LineDone\n';
  pkg.pendingJobs.workOrders.forEach(w=>{
    (w.items||[]).forEach(it=>{
      const fee=it.feesRate!=null?it.feesRate:(it.rate||0);
      const amt=it.amount!=null?it.amount:lineAmount(it);
      csv+=`${w.number},"${(w.clientName||'').replace(/"/g,'""')}",${w.date||''},${w.status||''},"${(it.servicePackage||'').replace(/"/g,'""')}","${(it.description||'').replace(/"/g,'""')}",${it.qty??1},${fee},${it.sc||0},${it.comm||0},${amt},${it.done?'Yes':'No'}\n`;
    });
  });
  csv+='\nOUTSTANDING INVOICES\nInvoice Number,Client,Date,Status,Total\n';
  pkg.pendingJobs.invoices.forEach(i=>{
    csv+=`${i.number},"${(i.clientName||'').replace(/"/g,'""')}",${i.date||''},${i.status||''},${i.total||0}\n`;
  });
  csv+='\nOPEN QUOTATIONS\nQuotation Number,Client,Date,Status,Total\n';
  pkg.pendingJobs.quotations.forEach(q=>{
    csv+=`${q.number},"${(q.clientName||'').replace(/"/g,'""')}",${q.date||''},${q.status||''},${q.total||0}\n`;
  });
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`YearEnd_${pkg.exportDate||today()}.csv`;
  a.click();URL.revokeObjectURL(url);
  toast('Year-end Excel (CSV) downloaded');
}

function importYearEndPackage(){
  const file=document.getElementById('yeImportFile')?.files?.[0];
  if(!file)return toast('Select a year-end JSON file first','error');
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const text=e.target.result;
      let pkg;
      if(file.name.toLowerCase().endsWith('.json')||text.trim().startsWith('{')){
        pkg=JSON.parse(text);
      }else{
        return toast('Please upload the Year-End JSON package (not CSV) for import','error');
      }
      if(pkg.type!=='yearEndCarryForward'||!pkg.openingBalances)throw new Error('Invalid year-end package');
      if(!confirm('Import opening balances and pending jobs only?\n\nThis will:\n• Set account balances from the file (Asset/Liability/Equity)\n• Add pending work orders, outstanding invoices and open quotations\n\nExisting completed documents are not deleted.'))return;
      // Apply opening balances
      let balCount=0;
      (pkg.openingBalances||[]).forEach(ob=>{
        let acc=DB.chartOfAccounts.find(a=>a.id===ob.id||a.code===ob.code);
        if(acc){acc.balance=Number(ob.balance)||0;balCount++;}
      });
      // Import pending work orders (new IDs to avoid collision)
      let woCount=0;
      (pkg.pendingJobs?.workOrders||[]).forEach(w=>{
        if((DB.workOrders||[]).some(x=>x.number===w.number))return; // skip duplicate numbers
        const items=(w.items||[]).map(it=>({...it,id:lineId(),invoiced:false}));
        DB.workOrders.push({
          id:uid(),number:w.number,clientId:w.clientId,clientName:w.clientName,
          employeeName:w.employeeName||'',date:w.date||today(),status:w.status||'Pending',
          items,notes:(w.notes||'')+' [Opening from prior year]',
          quotationId:w.quotationId||null,quotationNumber:w.quotationNumber||null,
          subtotal:items.reduce((s,i)=>s+(Number(i.amount)||lineAmount(i)),0),
          taxRate:0,taxAmount:0,total:items.reduce((s,i)=>s+(Number(i.amount)||lineAmount(i)),0)
        });
        woCount++;
      });
      let invCount=0;
      (pkg.pendingJobs?.invoices||[]).forEach(i=>{
        if((DB.invoices||[]).some(x=>x.number===i.number))return;
        DB.invoices.push({
          id:uid(),number:i.number,clientId:i.clientId,clientName:i.clientName,
          employeeName:i.employeeName||'',date:i.date||today(),dueDate:i.dueDate||'',
          status:i.status||'Pending',items:(i.items||[]).map(it=>({...it,id:lineId()})),
          subtotal:i.subtotal,taxRate:i.taxRate,taxAmount:i.taxAmount,total:i.total,
          notes:(i.notes||'')+' [Opening from prior year]',
          workOrderId:i.workOrderId||null,workOrderNumber:i.workOrderNumber||null
        });
        invCount++;
      });
      let qtCount=0;
      (pkg.pendingJobs?.quotations||[]).forEach(q=>{
        if((DB.quotations||[]).some(x=>x.number===q.number))return;
        DB.quotations.push({
          id:uid(),number:q.number,clientId:q.clientId,clientName:q.clientName,
          employeeName:q.employeeName||'',date:q.date||today(),validUntil:q.validUntil||'',
          status:q.status||'Draft',items:(q.items||[]).map(it=>({...it,id:lineId()})),
          subtotal:q.subtotal,taxRate:q.taxRate,taxAmount:q.taxAmount,total:q.total,
          notes:(q.notes||'')+' [Opening from prior year]'
        });
        qtCount++;
      });
      // Optional: post opening balance journal for BS accounts (memo only if needed)
      saveData();
      toast(`Imported: ${balCount} account balances, ${woCount} work orders, ${invCount} invoices, ${qtCount} quotations`);
      navigate('yearEndClosing');
    }catch(err){
      console.error(err);
      toast('Import failed: '+err.message,'error');
    }
  };
  reader.readAsText(file);
}
