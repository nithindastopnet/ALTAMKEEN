function getProfitFilteredData(){
  const from=document.getElementById('pr_from')?.value||'';
  const to=document.getElementById('pr_to')?.value||'';
  const clientId=document.getElementById('pr_client')?.value||'';
  const service=(document.getElementById('pr_service')?.value||'').toLowerCase();
  const search=(document.getElementById('pr_search')?.value||'').toLowerCase().trim();
  const status=document.getElementById('pr_status')?.value||'';

  let invoices=(DB.invoices||[]).filter(inv=>{
    if(inv.status==='Cancelled')return false;
    if(from&&(inv.date||'')<from)return false;
    if(to&&(inv.date||'')>to)return false;
    if(clientId&&inv.clientId!==clientId)return false;
    if(status&&inv.status!==status)return false;
    if(service){
      const items=inv.items||[];
      const has=items.some(it=>
        (it.servicePackage||'').toLowerCase().includes(service)||
        (it.description||'').toLowerCase().includes(service)
      );
      if(!has)return false;
    }
    if(search){
      const emp=docEmployeeName(inv).toLowerCase();
      const svcText=(inv.items||[]).map(it=>[it.servicePackage,it.description].join(' ')).join(' ').toLowerCase();
      const match=
        (inv.clientName||'').toLowerCase().includes(search)||
        emp.includes(search)||
        (inv.number||'').toLowerCase().includes(search)||
        svcText.includes(search)||
        (inv.notes||'').toLowerCase().includes(search);
      if(!match)return false;
    }
    return true;
  });

  // Service transactions (if used) contribute to revenue list for filtering
  let serviceTx=(DB.serviceTransactions||[]).filter(st=>{
    if(from&&(st.date||'')<from)return false;
    if(to&&(st.date||'')>to)return false;
    if(clientId&&st.clientId&&st.clientId!==clientId)return false;
    if(service){
      const txt=((st.serviceName||'')+' '+(st.description||'')).toLowerCase();
      if(!txt.includes(service))return false;
    }
    if(search){
      const txt=JSON.stringify(st).toLowerCase();
      if(!txt.includes(search))return false;
    }
    return true;
  });

  let expenses=(DB.expenses||[]).filter(ex=>{
    if(from&&(ex.date||'')<from)return false;
    if(to&&(ex.date||'')>to)return false;
    if(search){
      const txt=((ex.description||'')+' '+(ex.category||'')+' '+(ex.paymentMethod||'')).toLowerCase();
      // only apply text search to expenses when it looks like expense text (always include expenses in date range for profit calc unless pure text is filtering invoices only)
      if(txt.includes(search))return true;
      // keep expenses when search matches a client on invoices — still include company expenses
      if(clientId||service||status)return true;
      // if search only, don't exclude all expenses unless nothing matches
      return true;
    }
    return true;
  });

  const revenue=invoices.reduce((s,i)=>s+(Number(i.total)||0),0)+serviceTx.reduce((s,t)=>s+(Number(t.amount)||Number(t.total)||0),0);
  const expenseTotal=expenses.reduce((s,e)=>s+(Number(e.amount)||0),0);
  const gross=revenue-expenseTotal;
  return {invoices,expenses,serviceTx,revenue,expenseTotal,gross};
}
function applyProfitReport(){
  const data=getProfitFilteredData();
  const cur=DB.settings?.currency||'AED';
  const fmt=(n)=>cur+' '+(Number(n)||0).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});
  const elR=document.getElementById('prRevenue');
  const elE=document.getElementById('prExpenses');
  const elG=document.getElementById('prGross');
  const elC=document.getElementById('prInvCount');
  if(elR)elR.textContent=fmt(data.revenue);
  if(elE)elE.textContent=fmt(data.expenseTotal);
  if(elG){
    elG.textContent=fmt(data.gross);
    elG.style.color=data.gross>=0?'var(--success)':'var(--danger)';
  }
  if(elC)elC.textContent=data.invoices.length;
  // refresh currently open detail if any
  const title=document.getElementById('prDetailTitle')?.textContent||'';
  if(title.includes('Revenue')||title.includes('Invoice'))showProfitDetail('revenue');
  else if(title.includes('Expense'))showProfitDetail('expenses');
  else if(title.includes('Gross')||title.includes('Profit'))showProfitDetail('profit');
}

  let csv='';
  tables.forEach((table,ti)=>{
    if(ti>0)csv+='\n';
    const rows=table.querySelectorAll('tr');
    rows.forEach(tr=>{
      const cells=[...tr.querySelectorAll('th,td')].map(cell=>{
        let t=(cell.innerText||'').replace(/\s+/g,' ').trim();
        if(t.includes(',')||t.includes('"')||t.includes('\n'))t='"'+t.replace(/"/g,'""')+'"';
        return t;
      });
      csv+=cells.join(',')+'\n';
    });
  });
  // Also include stat cards as summary if present
  const stats=area.querySelectorAll('.stat-card');
  if(stats.length){
    csv+='\nSummary\n';
    stats.forEach(s=>{
      const label=(s.querySelector('.stat-label')?.innerText||'').trim();
      const value=(s.querySelector('.stat-value')?.innerText||'').trim();
      if(label||value)csv+=`"${label.replace(/"/g,'""')}","${value.replace(/"/g,'""')}"\n`;
    });
  }
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=(filename||('Report_'+today()))+'.csv';
  a.click();URL.revokeObjectURL(url);
  toast('Excel (CSV) downloaded');
}

function showClientStatement(){
  const id=document.getElementById('stmtClient')?.value;
  const from=document.getElementById('stmtFrom')?.value||'';
  const to=document.getElementById('stmtTo')?.value||'';
  const empFilter=(document.getElementById('stmtEmp')?.value||'').toLowerCase().trim();
  const box=document.getElementById('stmtContent');
  if(!box)return;
  if(!id){box.innerHTML='<div class="empty-state"><p>Select a client to view statement</p></div>';return;}
  const client=DB.clients.find(c=>c.id===id);
  if(!client)return;

  // Build ledger-style entries
  const entries=[];

  // Opening balance row (before from-date if set)
  let openingBal=0;
  // Collect all transactions for this client
  const allInv=(DB.invoices||[]).filter(i=>i.clientId===id&&i.status!=='Cancelled');
  const allRec=(DB.receipts||[]).filter(r=>r.clientId===id);
  const allWO=(DB.workOrders||[]).filter(w=>w.clientId===id&&w.status!=='Cancelled');
  const allQT=(DB.quotations||[]).filter(q=>q.clientId===id);

  // Helper: does entry match employee filter?
  const matchEmp=(empName)=>{
    if(!empFilter)return true;
    return (empName||'').toLowerCase().includes(empFilter);
  };

  // Invoices → Debit (amount due)
  allInv.forEach(inv=>{
    const emp=inv.employeeName||getClientEmployeeName(inv.clientId)||'';
    if(!matchEmp(emp))return;
    const items=inv.items||[];
    if(items.length){
      items.forEach(it=>{
        const fee=it.feesRate!=null?it.feesRate:(it.rate||0);
        const amt=it.amount!=null?it.amount:(lineAmount({...it,feesRate:fee}));
        entries.push({
          date:it.date||inv.date,
          ref:inv.number,
          particulars:it.servicePackage||it.description||'Invoice',
          description:it.description||'',
          qty:it.qty||1,
          unitAmt:fee,
          debit:amt,
          credit:0,
          emp,
          type:'invoice',
          docId:inv.id
        });
      });
    }else{
      entries.push({
        date:inv.date,ref:inv.number,particulars:'Invoice',description:inv.notes||'',
        qty:1,unitAmt:inv.total||0,debit:inv.total||0,credit:0,emp,type:'invoice',docId:inv.id
      });
    }
  });

  // Receipts → Credit (amount received)
  allRec.forEach(r=>{
    const emp=r.employeeName||getClientEmployeeName(r.clientId)||'';
    if(!matchEmp(emp))return;
    entries.push({
      date:r.date,
      ref:r.reference||r.id,
      particulars:'Amount Received',
      description:r.notes||r.method||'',
      qty:'',
      unitAmt:'',
      debit:0,
      credit:r.amount||0,
      emp,
      type:'receipt',
      docId:r.id
    });
  });

  // Sort by date
  entries.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.ref||'').localeCompare(b.ref||''));

  // Calculate opening balance (transactions before from date)
  if(from){
    entries.filter(e=>(e.date||'')<from).forEach(e=>{openingBal+=(e.debit||0)-(e.credit||0);});
  }

  // Filter by date range for display
  let display=entries;
  if(from)display=display.filter(e=>(e.date||'')>=from);
  if(to)display=display.filter(e=>(e.date||'')<=to);

  let running=openingBal;
  let rows='';

  // Opening balance row
  if(from||openingBal!==0){
    rows+=`<tr>
      <td>${from?formatDate(from):''}</td>
      <td></td>
      <td><strong>Opening Balance</strong></td>
      <td></td>
      <td class="text-right"></td>
      <td class="text-right"></td>
      <td class="text-right"></td>
      <td class="text-right"></td>
      <td class="text-right"><strong>${formatMoney(openingBal)}</strong></td>
    </tr>`;
  }

  display.forEach(e=>{
    running+=(e.debit||0)-(e.credit||0);
    const refLink=e.type==='invoice'
      ?`<a href="#" onclick="previewDocument('invoice','${e.docId}');return false;" style="color:var(--primary)">${esc(e.ref)}</a>`
      :esc(e.ref||'');
    rows+=`<tr>
      <td>${formatDate(e.date)}</td>
      <td>${refLink}</td>
      <td>${esc(e.particulars)}</td>
      <td>${esc(e.description)}${e.emp?` <span class="text-muted" style="font-size:11px">(${esc(e.emp)})</span>`:''}</td>
      <td class="text-right">${e.qty!==''&&e.qty!=null?e.qty:''}</td>
      <td class="text-right">${e.unitAmt!==''&&e.unitAmt!=null?formatMoney(e.unitAmt):''}</td>
      <td class="text-right">${e.debit?formatMoney(e.debit):''}</td>
      <td class="text-right">${e.credit?formatMoney(e.credit):''}</td>
      <td class="text-right">${formatMoney(running)}</td>
    </tr>`;
  });

  const totalDr=display.reduce((s,e)=>s+(e.debit||0),0);
  const totalCr=display.reduce((s,e)=>s+(e.credit||0),0);

  rows+=`<tr style="font-weight:700;border-top:2px solid var(--text)">
    <td colspan="6">Closing Balance</td>
    <td class="text-right">${formatMoney(totalDr)}</td>
    <td class="text-right">${formatMoney(totalCr)}</td>
    <td class="text-right">${formatMoney(running)}</td>
  </tr>`;

  box.innerHTML=`
    <div style="margin-bottom:12px">
      <strong>${esc(client.name)}</strong>
      ${(ensureClientEmployees(client).length)?` &nbsp;|&nbsp; Employees: <strong>${esc(ensureClientEmployees(client).map(e=>e.name).join(', '))}</strong>`:''}
      ${client.phone?` &nbsp;|&nbsp; ${esc(client.phone)}`:''}
      ${from||to?`<br><span class="text-muted" style="font-size:12px">Period: ${from?formatDate(from):'Start'} → ${to?formatDate(to):'End'}</span>`:''}
    </div>
    <div class="table-wrap"><table style="font-size:12px">
      <thead><tr>
        <th>Date</th>
        <th>Reference No.</th>
        <th>Particulars</th>
        <th>Description</th>
        <th class="text-right">Qty</th>
        <th class="text-right">Unit Amt</th>
        <th class="text-right">Debit</th>
        <th class="text-right">Credit</th>
        <th class="text-right">Balance</th>
      </tr></thead>
      <tbody>${rows||'<tr><td colspan="9" class="text-muted">No transactions in this period</td></tr>'}</tbody>
    </table></div>`;
}

function onUserRoleChange(){
  const role=val('u_role');

function saveUser(){
  if(!isAdminUser(currentUser))return toast('Admin only','error');
  const name=val('u_name');
  let id=val('u_id');
  const email=val('u_email');
  const role=val('u_role')||'user';
  const active=val('u_active')!=='false';
  const pwd=val('u_password');
  if(!name||!id)return toast('Name and Login ID required','error');
  id=id.replace(/\s+/g,'_');
  if(!editId&&(DB.users||[]).some(x=>x.id===id))return toast('Login ID already exists','error');
  let permissions;
  if(role==='admin')permissions=['*'];
  else permissions=[...document.querySelectorAll('.user-perm:checked')].map(c=>c.value);
  if(role!=='admin'&&!permissions.length)return toast('Select at least one module','error');
  if(editId){
    const idx=DB.users.findIndex(x=>x.id===editId);
    if(idx<0)return;
    const prev={...DB.users[idx]};
    const obj={...prev,name,email,role,active,permissions};
    // keep id stable for admin
    if(prev.id==='admin')obj.id='admin';
    else obj.id=prev.id;
    if(pwd)obj.password=pwd;
    if(obj.id==='admin'){obj.role='admin';obj.permissions=['*'];obj.active=true;}
    DB.users[idx]=obj;
    logActivity('user_update','Updated user '+obj.name+' ('+obj.id+')');
  }else{
    if(!pwd)return toast('Password required for new user','error');
    const obj={id,name,email,role,active,permissions,password:pwd};
    if(role==='admin')obj.permissions=['*'];
    DB.users.push(obj);
    logActivity('user_create','Created user '+name+' ('+id+')');
  }
  saveData();closeModal();toast('User saved');navigate('admin');
}

}

function wipeAllData(){
  if(!confirm('WIPE COMPLETE DATA?\n\nThis permanently deletes ALL data in the software including settings, clients, services and the browser database.'))return;
  if(!confirm('Final confirmation: wipe everything and start empty?'))return;
  const blank=JSON.parse(JSON.stringify(defaultData));
  // Empty transactional + masters for a true blank start (keep only chart template & default wallets/services from defaultData)
  blank.clients=[];blank.suppliers=[];blank.commissionSuppliers=[];
  blank.invoices=[];blank.quotations=[];blank.workOrders=[];
  blank.expenses=[];blank.receipts=[];blank.commissions=[];
  blank.loans=[];blank.chequePayments=[];blank.dividends=[];
  blank.taxPayments=[];blank.creditPayments=[];blank.refunds=[];
  blank.discounts=[];blank.serviceTransactions=[];blank.journalEntries=[];
  blank.nextJournalNo=1;
  DB=blank;
  // Clear IndexedDB fully then rewrite
  const wipeDB=()=>new Promise((resolve,reject)=>{
    try{
      const req=indexedDB.deleteDatabase(IDB_NAME);
      req.onsuccess=()=>resolve();
      req.onerror=()=>resolve(); // continue even if delete fails
      req.onblocked=()=>resolve();
    }catch(e){resolve();}
  });
  wipeDB().then(async()=>{
    try{idb=await openIDB();await saveDataNow();}catch(e){console.error(e);}
    toast('All data wiped — fresh install');
    navigate('dashboard');
    updateSidebarCompany();
  });
}

  {id:'chartOfAccounts',label:'Chart of Accounts'},
  {id:'journalEntries',label:'Journal Entries'},
  {id:'generalLedger',label:'General Ledger'},
  {id:'trialBalance',label:'Trial Balance'},
  {id:'profitLoss',label:'Profit & Loss'},
  {id:'balanceSheet',label:'Balance Sheet'},
  {id:'yearEndClosing',label:'Year-End Closing'},
  {id:'reports',label:'Reports (all)'},
  {id:'settings',label:'Settings'},
  {id:'admin',label:'Admin Panel'},
  {id:'backup',label:'Backup & Restore'}
];
function isAdminUser(u){return !!(u&&(u.role==='admin'||(u.permissions||[]).includes('*')));}
function currentUserName(){return currentUser?(currentUser.name||currentUser.email||currentUser.id):'System';}
function hasPermission(page){
  if(!currentUser)return false;
  if(isAdminUser(currentUser))return true;
  const perms=currentUser.permissions||[];
  if(perms.includes('*'))return true;
  if(perms.includes(page))return true;
  if(String(page||'').startsWith('report')&&perms.includes('reports'))return true;
  return false;
}
function logActivity(action,details){
  try{
    if(!DB)return;
    if(!Array.isArray(DB.activityLog))DB.activityLog=[];
    DB.activityLog.unshift({
      id:uid(),
      at:new Date().toISOString(),
      userId:currentUser?currentUser.id:'',
      userName:currentUserName(),
      action:String(action||''),
      details:String(details||'')
    });
    // keep last 2000 entries
    if(DB.activityLog.length>2000)DB.activityLog=DB.activityLog.slice(0,2000);
    saveData();
  }catch(e){console.error(e);}
}
function loadSession(){
  try{
    const raw=sessionStorage.getItem(SESSION_KEY)||localStorage.getItem(SESSION_KEY);
    if(!raw)return null;
    const s=JSON.parse(raw);
    const u=(DB.users||[]).find(x=>x.id===s.userId&&x.active!==false);
    if(!u)return null;
    // re-check password hash stored in session matches current password
    if(s.token!==simpleToken(u))return null;
    return u;
  }catch(e){return null;}
}
function simpleToken(u){
  return btoa(unescape(encodeURIComponent((u.id||'')+'|'+(u.password||'')+'|'+(u.role||''))));
}
function saveSession(u,remember){
  const payload=JSON.stringify({userId:u.id,token:simpleToken(u),at:Date.now()});
  sessionStorage.setItem(SESSION_KEY,payload);
  if(remember)localStorage.setItem(SESSION_KEY,payload);
  else localStorage.removeItem(SESSION_KEY);
}
function clearSession(){
  sessionStorage.removeItem(SESSION_KEY);
  localStorage.removeItem(SESSION_KEY);
  currentUser=null;
}
function showLogin(){
  const ov=document.getElementById('loginOverlay');
  if(ov){ov.style.display='flex';}
  document.getElementById('loadingOverlay').style.display='none';
  setTimeout(()=>{const el=document.getElementById('loginUser');if(el)el.focus();},100);
}
function hideLogin(){
  const ov=document.getElementById('loginOverlay');
  if(ov)ov.style.display='none';
}
function attemptLogin(){
  const id=(document.getElementById('loginUser')?.value||'').trim().toLowerCase();
  const pass=document.getElementById('loginPass')?.value||'';
  const err=document.getElementById('loginError');
  if(!id||!pass){
    if(err){err.style.display='block';err.textContent='Enter username and password';}
    return;
  }
  const u=(DB.users||[]).find(x=>{
    if(x.active===false)return false;
    const name=(x.name||'').toLowerCase();
    const email=(x.email||'').toLowerCase();
    const uid=(x.id||'').toLowerCase();
    return id===uid||id===email||id===name;
  });
  if(!u||String(u.password||'')!==pass){
    if(err){err.style.display='block';err.textContent='Invalid username or password';}
    logActivity('login_failed','Attempt for: '+id);
    return;
  }
  currentUser=u;
  saveSession(u,true);
  if(err)err.style.display='none';
  hideLogin();
  logActivity('login','User signed in');
  afterAuthStart();
}
function logout(){
  logActivity('logout','User signed out');
  clearSession();
  showLogin();
  const area=document.getElementById('contentArea');
  if(area)area.innerHTML='';
}
function afterAuthStart(){
  try{refreshReportsData();}catch(e){}
  try{(DB.clients||[]).filter(c=>c.type==='Establishment'&&!c.code).forEach(c=>{c.code=assignCompanyCode();});saveData();}catch(e){}
  buildSidebar();
  updateTopbarUser();
  updateSidebarCompany();
  const startPage=hasPermission('dashboard')?'dashboard':((currentUser.permissions||[])[0]||'dashboard');
  navigate(startPage);
  startAutoBackup();
}
function updateTopbarUser(){
  let el=document.getElementById('currentUserBadge');
  if(!el){
    const right=document.querySelector('.topbar-right');
    if(right){
      const span=document.createElement('span');
      span.id='currentUserBadge';
      span.style.cssText='font-size:12px;color:var(--text-muted);margin-right:6px';
      right.insertBefore(span,right.firstChild);
      el=span;
      const btn=document.createElement('button');
      btn.className='btn btn-outline btn-sm';
      btn.textContent='Logout';
      btn.onclick=logout;
      right.insertBefore(btn,right.firstChild.nextSibling);
    }
  }
  el=document.getElementById('currentUserBadge');
  if(el)el.textContent=currentUser?(currentUser.name+(isAdminUser(currentUser)?' (Admin)':'')):'';
}


async function init(){try{idb=await openIDB();await loadData();document.getElementById('loadingOverlay').style.display='none';
  currentUser=loadSession();
  if(!currentUser){showLogin();return;}
  hideLogin();
  afterAuthStart();
}catch(e){console.error(e);document.getElementById('loadingOverlay').innerHTML='Failed to open database. Please use a modern browser.';}}
init();
</script>
</body>
</html>
